<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Classic 2026 - Touch & Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px; }
    .header-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 16px; backdrop-filter: blur(8px); }
    .score-badge { font-weight: 700; font-size: 16px; color: #22c55e; }
    .best-badge { font-weight: 600; font-size: 14px; color: #facc15; }
    .btn-small { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .canvas-wrap { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; max-width: 480px; min-height: 280px; }
    canvas { display: block; border-radius: 16px; border: 2px solid rgba(34, 197, 94, 0.3); background: #0f172a; box-shadow: 0 0 35px rgba(34, 197, 94, 0.15); }
    .dpad-container { width: 100%; max-width: 320px; display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 8px; margin-bottom: 8px; }
    .dpad-btn { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.15); color: #fff; height: 52px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .dpad-btn:active { background: #22c55e; color: #0f172a; transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="header-bar">
      <div class="score-badge">🍎 <span id="scoreText">0</span></div>
      <div class="best-badge">👑 <span id="bestText">0</span></div>
      <button class="btn-small" id="soundBtn">🔊 Sound</button>
      <button class="btn-small" id="fsBtn">⛶ Full</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="dpad-container">
      <div></div>
      <button class="dpad-btn" id="btnUp">▲</button>
      <div></div>
      <button class="dpad-btn" id="btnLeft">◀</button>
      <button class="dpad-btn" id="btnDown">▼</button>
      <button class="dpad-btn" id="btnRight">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const bestText = document.getElementById('bestText');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');

    const GRID_SIZE = 20;
    const COLS = 20;
    const ROWS = 20;
    canvas.width = COLS * GRID_SIZE;
    canvas.height = ROWS * GRID_SIZE;

    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playBeep(freq, type='sine', dur=0.08) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let dir = {x: 0, y: -1};
    let nextDir = {x: 0, y: -1};
    let food = {x: 5, y: 5, type: 'apple'};
    let goldenFood = null;
    let goldenTimer = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestText.textContent = bestScore;
    let isGameOver = false;
    let isStarted = false;
    let lastTime = 0;
    let speed = 120; // ms per step

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
      if (Math.random() < 0.25 && !goldenFood) {
        goldenFood = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
          timer: 60
        };
      }
    }

    function resetGame() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dir = {x: 0, y: -1};
      nextDir = {x: 0, y: -1};
      score = 0;
      scoreText.textContent = score;
      isGameOver = false;
      isStarted = true;
      goldenFood = null;
      spawnFood();
    }

    function setDirection(dx, dy) {
      initAudio();
      if (!isStarted || isGameOver) {
        resetGame();
        return;
      }
      if (dx !== -dir.x || dy !== -dir.y) {
        nextDir = {x: dx, y: dy};
      }
    }

    document.getElementById('btnUp').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(1, 0); });

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDirection(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDirection(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDirection(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDirection(1, 0); }
      if (e.code === 'Space' && (isGameOver || !isStarted)) resetGame();
    });

    // Touch Swipes on canvas
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});
    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) setDirection(1, 0);
        else if (dx < -30) setDirection(-1, 0);
      } else {
        if (dy > 30) setDirection(0, 1);
        else if (dy < -30) setDirection(0, -1);
      }
    }, {passive: true});

    canvas.addEventListener('click', () => {
      if (!isStarted || isGameOver) resetGame();
    });

    function update() {
      if (!isStarted || isGameOver) return;
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        triggerGameOver();
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Eat Food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreText.textContent = score;
        playBeep(520, 'triangle', 0.1);
        if (score > bestScore) {
          bestScore = score;
          bestText.textContent = bestScore;
          localStorage.setItem('snake_best', bestScore);
        }
        spawnFood();
      } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 35;
        scoreText.textContent = score;
        playBeep(880, 'sine', 0.18);
        goldenFood = null;
      } else {
        snake.pop();
      }

      if (goldenFood) {
        goldenFood.timer--;
        if (goldenFood.timer <= 0) goldenFood = null;
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      playBeep(150, 'sawtooth', 0.4);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * GRID_SIZE);
        ctx.lineTo(canvas.width, j * GRID_SIZE);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI*2);
      ctx.fill();

      if (goldenFood) {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(goldenFood.x * GRID_SIZE + GRID_SIZE/2, goldenFood.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 1, 0, Math.PI*2);
        ctx.fill();
      }

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 6);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(segment.x * GRID_SIZE + 6, segment.y * GRID_SIZE + 6, 2, 0, Math.PI*2);
          ctx.arc(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + 6, 2, 0, Math.PI*2);
          ctx.fill();
        } else {
          const alpha = Math.max(0.4, 1 - (index / snake.length) * 0.6);
          ctx.fillStyle = `rgba(34, 197, 94, ${alpha})`;
          ctx.beginPath();
          ctx.roundRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4, 4);
          ctx.fill();
        }
      });

      // Overlay
      if (!isStarted) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SNAKE RETRO', canvas.width/2, canvas.height/2 - 20);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap D-Pad or Screen to Start', canvas.width/2, canvas.height/2 + 20);
      } else if (isGameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2 + 10);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('Tap to Play Again', canvas.width/2, canvas.height/2 + 45);
      }
    }

    function gameLoop(time) {
      if (time - lastTime > speed) {
        update();
        lastTime = time;
      }
      draw();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
    spawnFood();
  </script>
</body>
</html>

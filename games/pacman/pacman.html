/**
 * Main Styles
 */
html, body {
    margin: 0;
    padding: 0;
    border: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: transparent;
    backface-visibility: hidden;
}
html, body, input {
    font-family: "Whimsy TT";
    font-size: 18px;
    line-height: 1.5em;
    color: white;
}

h1 {
    font-size: 6em;
    font-weight: normal;
    text-align: center;
}
h2 {
    font-size: 4.5em;
    text-align: center;
}

a {
    color: rgb(204, 204, 204);
    text-decoration: none;
    font-size: 2em;
    line-height: 3rem;
    transition: all 0.2s;
    outline: none;
}
    a:hover {
        color: white;
        font-size: 2.5em;
    }


#container {
    position: absolute;
    top: 50%;
    bottom: 50%;
    left: 50%;
    right: 50%;
    margin-top: -18.5em;
    margin-left: -16em;
    width: 30em;
    height: 35em;
    box-shadow: inset 0 0 0 999px rgb(0, 0, 0);
    border: 1em solid rgba(0, 0, 0, 0.4);
}



/**
 * Game Design
 */
.board,
.screen,
.game {
    position: absolute;
    top: 1em;
    left: 1em;
}



/**
 * Show / Hide
 */
.mainScreen .main,
.gameOver   .input,
.highScores .high,
.help       .controls {
    display: block;
}

.display {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}



/**
 * MainScreen Design
 */
.main ul {
    text-align: center;
    padding: 0;
    margin-top: 21em;
}
.main li {
    list-style: none;
}



/**
 * High Scores Design
 */
.high {
    text-align: center;
}
.scores {
    text-align: center;
    font-size: 1.7em;
}
    .scores .titles,
    .scores .scores,
    .help   .titles,
    .help   .scores {
        float: left;
        clear: both;
        width: 100%;
    }
    .scores .titles {
        margin-bottom: 0.3em;
        color: rgb(255, 255, 51);
    }

    .scores .left,
    .scores .right,
    .help   .left,
    .help   .right {
        float: left;
        width: 40%;
        margin-bottom: 0.3em;
    }
    .scores .left,   .help .left   { text-align: right; }
    .scores .right,  .help .right  { text-align:  left; }
    .scores .middle, .help .middle {
        float: left;
        width: 20%;
        text-align: center;
        margin-bottom: 0.3em;
    }

.none {
    font-size: 2em;
    margin: 5em 0 0 0;
    color: rgb(255, 255, 51);
}

.restore, .back {
    position: absolute;
    bottom: 0.8em;
}
    .restore { left:  0.8em; }
    .back    { right: 0.8em; }



/**
 * Game Over Design
 */
.input {
    text-align: center;
}
.input p {
    font-size: 2em;
    color: rgb(255, 255, 51);
    margin-top: 4em;
}
.input input {
    background-color: transparent;
    border-color: rgb(0, 51, 255);
    border-radius: 0.6em;
    padding: 0.5em;
    font-size: 1.5em;
    margin-right: 0.5em;
}
.input input:focus {
    outline: none;
}
.restart {
    display: block;
    margin-top: 2em;
}



/**
 * Controls Design
 */
.controls ol {
    box-sizing: border-box;
    width: 95%;
    margin: 0 auto;
    font-size: 2em;
    line-height: 0.9em;
    color: rgb(255, 255, 51);
}
.controls ol li {
    margin-bottom: 0.7em;
}
.controls ol li span {
    color: white;
    font-size: 0.7em;
}

.controls a {
    float: right;
    margin-right: 5%;
}



/**
 * Audio Button
 */
.audio {
    position: absolute;
    bottom: 2em;
    left: 12em;
    width: 4em;
    height: 2.2em;
    cursor: pointer;
}
.audio:hover {
    transform: scale(1.2);
    transition: all 0.2s;
}

.audio .triangle {
    position: absolute;
    bottom: 0.2em;
    left: 0.2em;
    border: 1em solid transparent;
    border-right-color: rgb(204, 204, 204);
}
    .audio:hover .triangle { border-right-color: white; }

.audio .box {
    position: absolute;
    bottom: 0.9em;
    left: 1.1em;
    height: 0.6em;
    width: 0.5em;
    background-color: rgb(204, 204, 204);
}
    .audio:hover .box { background-color: white; }

.waves {
    position: absolute;
    bottom: 0;
    left: 2em;
}
    .waves div {
        position: absolute;
        left: 0;
        background-color: rgb(204, 204, 204);
        border-radius: 0 20em 20em 0;
    }
    .waves div:nth-child(1) {
        bottom: 0.3em;
        width:  1.8em;
        height: 1.8em;
    }
    .waves div:nth-child(2) {
        bottom: 0.5em;
        width:  1.4em;
        height: 1.4em;
    }
    .waves div:nth-child(3) {
        bottom: 0.7em;
        width:  1em;
        height: 1em;
    }
    .waves div:nth-child(4) {
        bottom: 0.9em;
        width:  0.6em;
        height: 0.6em;
    }

    .audio:hover .waves div {
        background-color: white;
    }
    .waves div:before {
        content: "";

<script>
// ===== utils/Utils.js =====
class Utils {
    static getTarget(event) {
        return event.target && event.target.closest ? event.target.closest('[data-action]') : event.target;
    }
    static rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    static rgba(r, g, b, a) { return `rgba(${r}, ${g}, ${b}, ${a})`; }
    static toEven(value) { return Math.round(value / 2) * 2; }
    static formatNumber(value, separator = ',') {
        const parts = String(value).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, separator);
        return parts.join('.');
    }
}

// ===== pacman/source/board/Canvas.js =====
// Utils




/**
 * Pacman Canvas
 */
class Canvas {

    /**
     * Pacman Canvas Constructor
     * @param {Board}  board
     * @param {String} name
     */
    constructor(board, name) {
        this.board = board;

        /** @type {HTMLCanvasElement} */
        const canvas  = document.querySelector(`.${name}`);
        canvas.width  = this.board.width;
        canvas.height = this.board.height;

        /** @type {CanvasRenderingContext2D} */
        this.ctx              = canvas.getContext("2d");
        this.ctx.font         = `2em "Whimsy TT"`;
        this.ctx.fillStyle    = "white";
        this.ctx.textAlign    = "center";
        this.ctx.textBaseline = "middle";

        this.rects            = [];

        return this;
    }

    /**
     * Fills the canvas with black at the given alpha value
     * @param {Number}  alpha
     * @param {Number=} x
     * @param {Number=} y
     * @param {Number=} width
     * @param {Number=} height
     * @returns {Void}
     */
    fill(alpha, x, y, width, height) {
        this.ctx.save();
        this.ctx.fillStyle = Utils.rgba(0, 0, 0, alpha);
        this.ctx.fillRect(x || 0, y || 0, width || this.board.width, height || this.board.height);
        this.ctx.restore();
    }

    /**
     * Clear the entire board
     * @returns {Void}
     */
    clear() {
        this.ctx.clearRect(0, 0, this.board.width, this.board.height);
        this.rects = [];
    }

    /**
     * Clears only the saved rects
     * @returns {Void}
     */
    clearSavedRects() {
        this.rects.forEach((rect) => {
            this.ctx.clearRect(rect.x, rect.y, rect.width, rect.height);
            if (rect.alpha) {
                this.fill(rect.alpha, rect.x, rect.y, rect.width, rect.height);
            }
        });
        this.rects = [];
    }

    /**
     * Saves a new position to clear in the future
     * @param {Number} x
     * @param {Number} y
     * @returns {Void}
     */
    savePos(x, y) {
        this.rects.push({
            x      : x - this.board.eraseSize / 2,
            y      : y - this.board.eraseSize / 2,
            width  : this.board.eraseSize,
            height : this.board.eraseSize,
        });
    }

    /**
     * Saves a new rectangle to clear in the future
     * @param {{x: Number, y: Number, width: Number, height: Number, alpha: ?Number}} data
     * @returns {Void}
     */
    saveRect(data) {
        this.rects.push(data);
    }

    /**
     * Draws the Text in the canvas
     * @param {{text: String, pos: {x: Number, y: Number}, color: ?String, size: ?Number, align: ?String, alpha: ?Number}} data
     * @returns {Void}
     */
    drawText(data) {
        const posX = data.pos.x * this.board.tileSize;
        const posY = data.pos.y * this.board.tileSize;
        let   mult = 0.5;

        this.ctx.save();
        if (data.size) {
            this.ctx.font = `${data.size}em "Whimsy TT"`;
        }
        if (data.align) {
            // @ts-ignore
            this.ctx.textAlign = data.align;
            mult = data.align === "left" ? 1 : 0;
        }
        this.ctx.fillStyle = data.color;
        this.ctx.fillText(data.text, posX, posY);
        this.ctx.restore();

        const metrics = this.ctx.measureText(data.text);
        const width   = metrics.width + this.board.tileSize;
        const height  = data.size ? (data.size + 0.5) * this.board.tileSize : 2.5 * this.board.tileSize;

        this.saveRect({
            x      : posX - mult * width,
            y      : posY - height / 2,
            width  : width,
            height : height,
            alpha  : data.alpha || 0,
        });
    }
}

// ===== pacman/source/board/BoardCanvas.js =====
/**
 * Pacman Board Canvas
 * @extends {Canvas}
 */
class BoardCanvas extends Canvas {

    /**
     * Pacman Board Canvas constructor
     * @param {Board} board
     */
    constructor(board) {
        super(board, "board");

        this.ctx.lineWidth   = board.lineWidth;
        this.ctx.strokeStyle = board.boardColor;


        this.drawTShapes = {
            "down"  : { radians: 0,   x:  0, y:  0 },
            "left"  : { radians: 0.5, x:  0, y: -5 },
            "right" : { radians: 1.5, x: -1, y:  0 },
            "up"    : { radians: 1,   x: -1, y: -5 }
        };
        this.radians = {
            "top-left"     : { from:   1, to: 1.5 },
            "top-right"    : { from: 1.5, to:   2 },
            "bottom-right" : { from:   0, to: 0.5 },
            "bottom-left"  : { from: 0.5, to:   1 }
        };
        this.corners = {
            "top-left"     : { x:  1, y:  1 },
            "top-right"    : { x: -1, y:  1 },
            "bottom-right" : { x: -1, y: -1 },
            "bottom-left"  : { x:  1, y: -1 }
        };
        this.smallCorners = {
            "top-left" : {
                x : { cell: 1, line: -1 },
                y : { cell: 1, line: -1 }
            },
            "top-right" : {
                x : { cell: 0, line:  1 },
                y : { cell: 1, line: -1 }
            },
            "bottom-right" : {
                x : { cell: 0, line:  1 },
                y : { cell: 0, line:  1 }
            },
            "bottom-left" : {
                x : { cell: 1, line: -1 },
                y : { cell: 0, line:  1 }
            }
        };
    }



    /**
     * Draw the this.board
     * @param {Boolean} newLevel
     * @returns {Void}
     */
    drawBoard(newLevel) {
        this.drawGhostsPen();

        this.ctx.save();
        this.ctx.strokeStyle = newLevel ? "white" : this.board.boardColor;
        this.drawOuterBorder();
        this.drawInnerBorder();

        // First Row
        this.drawRectangle(2,  2,  4, 3);
        this.drawRectangle(7,  2,  5, 3);
        this.drawRectangle(16, 2,  5, 3);
        this.drawRectangle(22, 2,  4, 3);

        // Second Row
        this.drawRectangle(2,  6, 4, 2);
        this.drawTShape(7,     6, 4, 4, "right");
        this.drawTShape(10,    6, 4, 4, "down");
        this.drawTShape(16,    6, 4, 4, "left");
        this.drawRectangle(22, 6, 4, 2);

        // Third Row
        this.drawRectangle(7,  15, 2, 5);
        this.drawTShape(10,    18, 4, 4, "down");
        this.drawRectangle(19, 15, 2, 5);

        // Fourth Row
        this.drawLShape(2,     21, false);
        this.drawRectangle(7,  21, 5, 2);
        this.drawRectangle(16, 21, 5, 2);
        this.drawLShape(22,    21, true);

        // Fith Row
        this.drawTShape(2,  24, 4, 6, "up");
        this.drawTShape(10, 24, 4, 4, "down");
        this.drawTShape(16, 24, 6, 4, "up");

        this.ctx.restore();
    }

    /**
     * Draws the Ghosts Pen House
     * @returns {Void}
     */
    drawGhostsPen() {
        this.ctx.strokeRect(10.5 * this.board.tileSize,                  12.5 * this.board.tileSize,                  7 * this.board.tileSize,                   4 * this.board.tileSize);
        this.ctx.strokeRect(11   * this.board.tileSize - this.board.halfLine, 13   * this.board.tileSize - this.board.halfLine, 6 * this.board.tileSize + this.board.lineWidth, 3 * this.board.tileSize + this.board.lineWidth);
        this.ctx.strokeRect(13   * this.board.tileSize - this.board.halfLine, 12.5 * this.board.tileSize,                  2 * this.board.tileSize + this.board.lineWidth, this.board.tileSize / 2 - this.board.halfLine);
        this.ctx.clearRect(13    * this.board.tileSize,                  12.5 * this.board.tileSize - this.board.halfLine, 2 * this.board.tileSize,                   this.board.tileSize / 2 + this.board.halfLine);

        this.ctx.save();
        this.ctx.strokeStyle = "white";
        this.ctx.strokeRect(13   * this.board.tileSize + this.board.halfLine, 12.5 * this.board.tileSize + this.board.lineWidth, 2 * this.board.tileSize - this.board.lineWidth, this.board.halfLine);
        this.ctx.restore();
    }

    /**
     * Draws the this.board outer border
     * @returns {Void}
     */
    drawOuterBorder() {
        this.ctx.beginPath();

        // Top Corners
        this.drawOuterBigCorner(0,  0, "top-left");
        this.drawOuterBigCorner(27, 0, "top-right");

        // Right Tunnel
        this.drawOuterBigCorner(27,    9, "bottom-right");
        this.drawOuterSmallCorner(22,  9, "top-left");
        this.drawOuterSmallCorner(22, 13, "bottom-left");
        this.ctx.lineTo(28 * this.board.tileSize, 13 * this.board.tileSize + this.board.halfLine);
        this.ctx.moveTo(28 * this.board.tileSize, 16 * this.board.tileSize - this.board.halfLine);
        this.drawOuterSmallCorner(22, 15, "top-left");
        this.drawOuterSmallCorner(22, 19, "bottom-left");
        this.drawOuterBigCorner(27,   19, "top-right");

        // Bottom Corners
        this.drawOuterBigCorner(27,   30, "bottom-right");
        this.drawOuterBigCorner(0,    30, "bottom-left");

        // Left Tunnel
        this.drawOuterBigCorner(0,    19, "top-left");
        this.drawOuterSmallCorner(5,  19, "bottom-right");
        this.drawOuterSmallCorner(5,  15, "top-right");
        this.ctx.lineTo(0, 16 * this.board.tileSize - this.board.halfLine);
        this.ctx.moveTo(0, 13 * this.board.tileSize + this.board.halfLine);
        this.drawOuterSmallCorner(5,  13, "bottom-right");
        this.drawOuterSmallCorner(5,   9, "top-right");
        this.drawOuterBigCorner(0,     9, "bottom-left");

        this.ctx.lineTo(this.board.halfLine, this.board.bigRadius + this.board.halfLine);
        this.ctx.stroke();
    }

    /**
     * Draws the this.board inner border
     * @returns {Void}
     */
    drawInnerBorder() {
        this.ctx.beginPath();

        // Top Border
        this.drawInnerCorner(0,   0, "top-left",     false, false);
        this.drawInnerCorner(13,  0, "top-right",    false, false);
        this.drawInnerCorner(13,  4, "bottom-left",  true,  true);
        this.drawInnerCorner(14,  4, "bottom-right", true,  true);
        this.drawInnerCorner(14,  0, "top-left",     false, false);
        this.drawInnerCorner(27,  0, "top-right",    false, false);

        // Right Border
        this.drawInnerCorner(27,  9, "bottom-right", false, false);
        this.drawInnerCorner(22,  9, "top-left",     true,  true);
        this.drawInnerCorner(22, 13, "bottom-left",  true,  true);
        this.ctx.lineTo(28 * this.board.tileSize, 13.5 * this.board.tileSize);
        this.ctx.moveTo(28 * this.board.tileSize, 15.5 * this.board.tileSize);
        this.drawInnerCorner(22, 15, "top-left",     true,  true);
        this.drawInnerCorner(22, 19, "bottom-left",  true,  true);
        this.drawInnerCorner(27, 19, "top-right",    false, false);
        this.drawInnerCorner(27, 24, "bottom-right", false, false);
        this.drawInnerCorner(25, 24, "top-left",     true,  true);
        this.drawInnerCorner(25, 25, "bottom-left",  true,  true);
        this.drawInnerCorner(27, 25, "top-right",    false, false);

        // Bottom Border
        this.drawInnerCorner(27, 30, "bottom-right", false, false);
        this.drawInnerCorner(0,  30, "bottom-left",  false, false);

        // Left Border
        this.drawInnerCorner(0,  25, "top-left",     false, false);
        this.drawInnerCorner(2,  25, "bottom-right", true,  true);
        this.drawInnerCorner(2,  24, "top-right",    true,  true);
        this.drawInnerCorner(0,  24, "bottom-left",  false, false);
        this.drawInnerCorner(0,  19, "top-left",     false, false);
        this.drawInnerCorner(5,  19, "bottom-right", true,  true);
        this.drawInnerCorner(5,  15, "top-right",    true,  true);
        this.ctx.lineTo(0, 15.5 * this.board.tileSize);
        this.ctx.moveTo(0, 13.5 * this.board.tileSize);
        this.drawInnerCorner(5,  13, "bottom-right", true,  true);
        this.drawInnerCorner(5,   9, "top-right",    true,  true);
        this.drawInnerCorner(0,   9, "bottom-left",  false, false);
        this.ctx.lineTo(this.board.tileSize / 2, this.board.tileSize / 2 + this.board.smallRadius);

        this.ctx.stroke();
    }



    /**
     * Draws a drawRectangle at the given position with the given size
     * @param {Number} x
     * @param {Number} y
     * @param {Number} width
     * @param {Number} height
     * @returns {Void}
     */
    drawRectangle(x, y, width, height) {
        this.ctx.save();
        this.ctx.translate(x * this.board.tileSize, y * this.board.tileSize);

        this.ctx.beginPath();
        this.drawInnerCorner(0,                  0, "top-left",     true, false);
        this.drawInnerCorner(width - 1,          0, "top-right",    true, false);
        this.drawInnerCorner(width - 1, height - 1, "bottom-right", true, false);
        this.drawInnerCorner(0,         height - 1, "bottom-left",  true, false);
        this.ctx.closePath();

        this.ctx.stroke();
        this.ctx.restore();
    }

    /**
     * Draws a t shape at the given position and with the given properties
     * @param {Number} x
     * @param {Number} y
     * @param {Number} left
     * @param {Number} right
     * @param {String} type
     * @returns {Void}
     */
    drawTShape(x, y, left, right, type) {
        const data  = this.drawTShapes[type];
        const width = left + right;

        this.ctx.save();
        this.ctx.translate(x * this.board.tileSize, y * this.board.tileSize);
        this.ctx.rotate(data.radians * Math.PI);
        this.ctx.translate(data.x * width * this.board.tileSize, data.y * this.board.tileSize);

        this.ctx.beginPath();
        this.drawInnerCorner(0,         0, "top-left",     true,  false);
        this.drawInnerCorner(width - 1, 0, "top-right",    true,  false);
        this.drawInnerCorner(width - 1, 1, "bottom-right", true,  false);
        this.drawInnerCorner(left,      1, "top-left",     false, true);
        this.drawInnerCorner(left,      4, "bottom-right", true,  false);
        this.drawInnerCorner(left - 1,  4, "bottom-left",  true,  false);
        this.drawInnerCorner(left - 1,  1, "top-right",    false, true);
        this.drawInnerCorner(0,         1, "bottom-left",  true,  false);

        this.ctx.stroke();
        this.ctx.restore();
    }

    /**
     * Draws an l shape at the given position
     * @param {Number}  x
     * @param {Number}  y
     * @param {Boolean} reflect
     * @returns {Void}
     */
    drawLShape(x, y, reflect) {
        this.ctx.save();
        this.ctx.translate(x * this.board.tileSize, y * this.board.tileSize);

        if (reflect) {
            this.ctx.transform(-1, 0, 0, 1, 0, 0);
            this.ctx.translate(-4 * this.board.tileSize, 0);
        }

        this.ctx.beginPath();
        this.drawInnerCorner(0, 0, "top-left",     true,  false);
        this.drawInnerCorner(3, 0, "top-right",    true,  false);
        this.drawInnerCorner(3, 4, "bottom-right", true,  false);
        this.drawInnerCorner(2, 4, "bottom-left",  true,  false);
        this.drawInnerCorner(2, 1, "top-right",    false, true);
        this.drawInnerCorner(0, 1, "bottom-left",  true,  false);

        this.ctx.stroke();
        this.ctx.restore();
    }


    /**
     * Draws a corner for the outer line with a big angle
     * @param {Number} x
     * @param {Number} y
     * @param {String} type
     * @returns {Void}
     */
    drawOuterBigCorner(x, y, type) {
        const data = this.corners[type];
        const pos  = {
            x : x * this.board.tileSize + this.board.bigRadius + data.x * this.board.halfLine,
            y : y * this.board.tileSize + this.board.bigRadius + data.y * this.board.halfLine
        };
        this.drawCorner(pos, this.board.bigRadius, type, false);
    }

    /**
     * Draws a corner for the outer line with a small angle
     * @param {Number} x
     * @param {Number} y
     * @param {String} type
     * @returns {Void}
     */
    drawOuterSmallCorner(x, y, type) {
        const radius = this.corners[type];
        const data   = this.smallCorners[type];
        const pos    = {
            x : (x + data.x.cell) * this.board.tileSize + radius.x * this.board.smallRadius + data.x.line * this.board.halfLine,
            y : (y + data.y.cell) * this.board.tileSize + radius.y * this.board.smallRadius + data.y.line * this.board.halfLine
        };
        this.drawCorner(pos, this.board.smallRadius, type, true);
    }

    /**
     * Draws a corner for the board
     * @param {Number} x
     * @param {Number} y
     * @param {String} type
     * @param {Boolean} isBig
     * @param {Boolean} anitclockwise
     * @returns {Void}
     */
    drawInnerCorner(x, y, type, isBig, anitclockwise) {
        const radius = isBig ? this.board.bigRadius : this.board.smallRadius;
        const data   = this.corners[type];
        const pos    = {
            x : (x + 0.5) * this.board.tileSize + data.x * radius,
            y : (y + 0.5) * this.board.tileSize + data.y * radius
        };
        this.drawCorner(pos, radius, type, anitclockwise);
    }

    /**
     * Draws a corner at the given position and with the given radius and type
     * @param {{x: Number, y: Number}} pos
     * @param {Number}                 radius
     * @param {String}                 type
     * @param {Boolean}                anitclockwise
     * @returns {Void}
     */
    drawCorner(pos, radius, type, anitclockwise) {
        let   rad    = this.radians[type];
        const result = [ rad.from * Math.PI, rad.to * Math.PI ];

        if (anitclockwise) {
            result.reverse();
        }
        rad = { from: result[0], to: result[1] };

        this.ctx.arc(pos.x, pos.y, radius, rad.from, rad.to, anitclockwise);
    }



    /**
     * Draws lines over the board for testing
     * @returns {Void}
     */
    drawLines() {
        this.ctx.strokeStyle = "#CCC";
        this.ctx.lineWidth   = 1;
        this.ctx.beginPath();

        for (let i = 0; i < this.board.rows; i += 1) {
            this.ctx.moveTo(0,           i * this.board.tileSize);
            this.ctx.lineTo(this.board.width, i * this.board.tileSize);
        }
        for (let i = 0; i < this.board.cols; i += 1) {
            this.ctx.moveTo(i * this.board.tileSize, 0);
            this.ctx.lineTo(i * this.board.tileSize, this.board.canvasHeight);
        }
        this.ctx.stroke();
    }

    /**
     * Draws the intersections over the board for testing
     * @returns {Void}
     */
    drawIntersections() {
        Object.keys(this.board.boardTurns).forEach((key) => {
            const coords = key.replace("x", "").split("y");
            const x      = this.board.getTileCorner(Number(coords[0]));
            const y      = this.board.getTileCorner(Number(coords[1]));

            this.ctx.fillRect(x, y, this.board.tileSize, this.board.tileSize);
            this.ctx.save();
            this.ctx.strokeStyle = "white";

            this.board.boardTurns[key].forEach((value) => {
                const dir = this.board.numberToDir(value);
                const bx  = this.board.getTileCorner(Number(coords[0]) + dir.x);
                const by  = this.board.getTileCorner(Number(coords[1]) + dir.y);

                this.ctx.strokeRect(bx, by, this.board.tileSize, this.board.tileSize);
            });
            this.ctx.restore();
        });
    }
}

/**
 * Pacman Game Canvas
 * @extends {Canvas}
 */
class GameCanvas extends Canvas {

    /**
     * Pacman Game Canvas constructor
     * @param {Board} board
     */
    constructor(board) {
        super(board, "game");
    }



    /**
     * Draws the Ghosts Targets for testing
     * @param {Ghost[]} ghosts
     * @returns {Void}
     */
    drawTargets(ghosts) {
        this.ctx.save();
        ghosts.forEach((ghost) => {
            this.ctx.fillStyle   = ghost.bodyColor;
            this.ctx.strokeStyle = ghost.bodyColor;

            const tile = this.board.getTileXYCenter(ghost.target);
            this.ctx.beginPath();
            this.ctx.moveTo(ghost.x, ghost.y);
            this.ctx.lineTo(tile.x, tile.y);
            this.ctx.fillRect(tile.x - 4, tile.y - 4, 8, 8);
            this.ctx.stroke();
        });
        this.ctx.restore();
    }
}

class Level {

     * Pacman Level constructor
     */
    constructor() {
        this.gameLevel = 1;
    }

    /**
     * Starts the Game
     * @returns {Void}
     */
    start() {
        this.gameLevel = 1;
    }

    /**
     * Returns the game level
     * @returns {Number}
     */
    get() {
        return this.gameLevel;
    }

    /**
     * Increases the game level
     * @returns {Void}
     */
    inc() {
        this.gameLevel += 1;
    }



    /**
     * The amount of time a fruit stays in the board
     * @returns {Number}
     */
    get fruitTime() {
        return Math.round(Math.random() * 1000) + 9000;
    }

    /**
     * The amount of dots left before showing the fruit
     * @returns {Number}
     */
    get fruitDots1() {
        return fruitDots1;
    }

    /**
     * The amount of dots left before showing the fruit
     * @returns {Number}
     */
    get fruitDots2() {
        return fruitDots2;
    }

    /**
     * The value for the energizer
     * @returns {Number}
     */
    get energizerValue() {
        return energizerValue;
    }

    /**
     * The value for the pill
     * @returns {Number}
     */
    get pillValue() {
        return pillValue;

    /**
     * The score required for each extra life
     * @returns {Number}
     */
    get extraLife() {
        return extraLife;
    }

    /**
     * Returns the pills multiplier
     * @returns {Number}
     */
    get pillMult() {
        return pillMult;
    }

    /**
     * Returns the eves bonus score
     * @returns {Number}
     */
    get eyesBonus() {
        return eyesBonus;
    }

    /**
     * Returns the total amount of Ghost's mode switches
     * @returns {Number}
     */
    get totalSwitches() {
        return totalSwitches;
    }

    /**
     * Returns the Ghost's blink time
     * @returns {Number}
     */
    get blinksTimer() {
        return blinksTimer;
    }

    /**
     * Returns the Ghost's eyes mode speed
     * @returns {Number}
     */
    get eyesSpeed() {
        return eyesSpeed;
    }



    /**
     * Returns the value asociated with the given key for the current level
     * @param {String} variable
     * @returns {(Number|String|Number[])}
     */
    getData(variable) {
        const level = Math.min(this.gameLevel - 1, levelsData.length - 1);
        const data  = levelsData[level];
        const value = data[variable];

        if (Array.isArray(value)) {
            return Object.create(value);
        }
        return value;
    }

    /**
     * Returns the value asociated with the given key for the current level
     * @param {String} variable
     * @returns {Number}
     */
    getNumber(variable) {
        return Number(this.getData(variable));
    }

    /**
     * Returns the fruit name for the current level
     * @returns {String}
     */
    get fruitName() {
        const fruitType = this.getNumber("fruitType");
        return fruitNames[fruitType - 1];
    }

    /**
     * Returns the Pen Force time in miliseconds
     * @returns {Number}
     */
    get penForceTime() {
        return this.getNumber("penForceTime") * 1000;
    }

    /**
     * Returns the switch time at the given mode in miliseconds
     * @param {Number} mode
     * @returns {Number}
     */
    getSwitchTime(mode) {
        return this.getData("switchTimes")[mode] * 1000;
    }

    /**
     * Returns the Fright time in miliseconds
     * @returns {Number}
     */
    get frightTime() {
        return this.getNumber("frightTime") * 1000;
    }

    /**
     * Returns the amount of switchs when blinking in fright mode
     * @returns {Number}
     */
    get blinks() {
        return this.getNumber("frightBlinks") * 2;
    }

    /**
     * Returns the ghost speed
     * @param {Boolean} inPen
     * @returns {Number}
     */
    getGhostSpeed(inPen) {
        return inPen ? inPenSpeed : this.getNumber("ghostSpeed");
    }

    /**
     * Returns the ghost speed inside a path
     * @param {String} path
     * @returns {Number}
     */
    getPathSpeed(path) {
        return pathSpeeds[path];
    }

    /**
     * Returns the Score for a dead Ghost
     * @param {Number} amount
     * @returns {Number}
     */
    getGhostScore(amount) {
        return Math.pow(2, amount) * 100;
    }

    /**
     * Returns the amount of dots required before exiting the Pen for the given ghost
     * @param {Number} ghost
     * @returns {Number}
     */
    getPenDotsCount(ghost) {
        return penDotsCount[ghost];
    }

    /**
     * Returns true if the given mode is Frighten
     * @param {String} mode
     * @returns {Boolean}
     */
    isFrighten(mode) {
        return mode === "blue" || mode === "white";
    }
};

/**
 * Pacman Board
 */
class Board {

    /**
     * Pacman Board Constructor
     */
    constructor() {
        this.level        = new Level();
        this.boardCanvas  = new BoardCanvas(this);
        this.screenCanvas = new Canvas(this, "screen");
        this.gameCanvas   = new GameCanvas(this);
    }



    /**
     * Starts the Game
     * @returns {Void}
     */
    start() {
        this.level.start();
        this.drawBoard(false);
    }

    /**
     * Clears the saved rects in the Game Canvas
     * @returns {Void}
     */
    clearGame() {
        this.gameCanvas.clearSavedRects();
    }

    /**
     * Draws the board
     * @param {Boolean} newLevel
     * @returns {Void}
     */
    drawBoard(newLevel) {
        this.boardCanvas.drawBoard(newLevel);
    }

    /**
     * Clears all the Canvas
     * @returns {Void}
     */
    clearAll() {
        this.boardCanvas.clear();
        this.gameCanvas.clear();
        this.screenCanvas.clear();
    }



    /**
     * Returns the width of the canvas
     * @returns {Number}
     */
    get width() {
        return tileSize * this.cols;
    }

    /**
     * Returns the height of the canvas and score
     * @returns {Number}
     */
    get height() {
        const scoreHeight = tileSize * 2;
        return this.canvasHeight + scoreHeight;
    }

    /**
     * Returns the canvas height
     * @returns {Number}
     */
    get canvasHeight() {
        return tileSize * this.rows;
    }

    /**
     * Returns the amount of columns of the matrix
     * @returns {Number}
     */
    get cols() {
        return boardMatrix[0].length;
    }

    /**
     * Returns the amount of rows of the matrix
     * @returns {Number}
     */
    get rows() {
        return boardMatrix.length;
    }

    /**
     * Returns the tile size
     * @returns {Number}
     */
    get tileSize() {
        return tileSize;
    }

    /**
     * Returns the line width
     * @returns {Number}
     */
    get lineWidth() {
        return lineWidth;
    }

    /**
     * Returns the half of the line width
     * @returns {Number}
     */
    get halfLine() {
        return lineWidth / 2;
    }

    /**
     * Returns the big radius
     * @returns {Number}
     */
    get bigRadius() {
        return tileSize / 2;
    }

    /**
     * Returns the small radius
     * @returns {Number}
     */
    get smallRadius() {
        return tileSize / 4;
    }

    /**
     * Returns the erase size
     * @returns {Number}
     */
    get eraseSize() {
        return tileSize * 2;
    }

    /**
     * Returns the board color
     * @returns {String}

    get boardColor() {
        return "rgb(0, 51, 255)";

    /**

    /**

    get energizers() {
        return [
            { x:  1, y:  3 },
            { x: 26, y:  3 },
            { x:  1, y: 23 },
            { x: 26, y: 23 },
        ];
    }

    /**
     * Returns the amount of Pills in the board
     * @returns {Number}
     */
    get pillAmount() {
        return 244;
    }

    /**
     * The size of the pill in the board
     * @returns {Number}
     */
    get pillSize() {
        return Utils.toEven(tileSize * 0.16666);
    }

    /**
     * The size of the energizer in the board
     * @returns {Number}
     */
    get energizerSize() {
        return Utils.toEven(tileSize * 0.41666);
    }


    /**
     * The tile of the fruit in the board
     * @returns {{x: Number, y: Number}}
     */
    get fruitTile() {
        return { x: 13.25, y: 16.8333 };
    }

    /**
     * The position of the fruit in the board
     * @returns {{x: Number, y: Number}}
     */
    get fruitPos() {
        return this.tileToPos(this.fruitTile);
    }

    /**
     * The size of the fruit in the board
     * @returns {Number}
     */
    get fruitSize() {
        return Math.round(tileSize * 1.6);
    }

    /**
     * Returns the rectangle for the Fruit
     * @returns {{left: Number, right: Number, top: Number, bottom: Number}}
     */
    get fruitRect() {
        const pos  = this.fruitPos;
        const size = this.fruitSize / 3;

        return {
            left   : pos.x - size,
            right  : pos.x + size,
            top    : pos.y - size,
            bottom : pos.y + size,
        };
    }



    /**
     * The blob radius in the board
     * @returns {Number}
     */
    get blobRadius() {
        return Utils.toEven(tileSize / 1.5);
    }

    /**
     * Returns the starting position of the blob
     * @returns {{x: Number, y: Number}}
     */
    get startingPos() {
        return { x: 14, y: 23 };
    }

    /**
     * Returns the starting direction of the blob
     * @returns {{x: Number, y: Number}}
     */
    get startingDir() {
        return { x: -1, y: 0 };
    }



    /**
     * The ghost size in the board
     * @returns {Number}
     */
    get ghostSize() {
        return Utils.toEven(tileSize * 1.5);
    }

    /**
     * Returns the eyes target
     * @returns {{x: Number, y: Number}}
     */
    get eyesTarget() {
        return { x: 13, y: 11 };
    }

    /**
     * Returns the ghost starting tile depending if is on the pen
     * @param {Boolean} inPen
     * @returns {{x: Number, y: Number}}
     */
    getGhostStartTile(inPen) {
        return inPen ? { x: 13, y: 14 } : { x: 13, y: 11 };
    }

    /**
     * Returns the ghost starting turn depending if is on the pen
     * @param {Boolean} inPen
     * @returns {?{x: Number, y: Number}}
     */
    getGhostStartTurn(inPen) {
        return inPen ? { x: -1, y: 0 } : null;
    }



    /**
     * Converts an x,y tile into an x,y position
     * @param {{x: Number, y: Number}} tile
     * @returns {{x: Number, y: Number}}
     */
    tileToPos(tile) {
        return { x: tile.x * tileSize, y: tile.y * tileSize };
    }

    /**
     * Returns the position at the middle of a tile
     * @param {Number} tile
     * @returns {Number}
     */
    getTileCenter(tile) {
        return Math.round((tile + 0.5) * tileSize);
    }

    /**
     * Returns the position at the middle of a tile
     * @param {{x: Number, y: Number}} tile
     * @returns {{x: Number, y: Number}}
     */
    getTileXYCenter(tile) {
        return {
            x : this.getTileCenter(tile.x),
            y : this.getTileCenter(tile.y)
        };
    }

    /**
     * Returns the position at the top-left corner of a tile
     * @param {Number} tile
     * @returns {Number}
     */
    getTileCorner(tile) {
        return Math.round(tile * tileSize);
    }

    /**
     * Returns the position of a tile in terms of the matrix coordinates
     * @param {Number} x
     * @param {Number} y
     * @returns {{x: Number, y: Number}}
     */
    getTilePos(x, y) {
        return {
            x : Math.floor(x / tileSize),
            y : Math.floor(y / tileSize)
        };
    }

    /**
     * Does a sumatory over all the tiles
     * @param {...{x: Number, y: Number}} tiles
     * @returns {{x: Number, y: Number}}
     */
    sumTiles(...tiles) {
        return tiles.reduce((last, current) => {
            return { x: last.x + current.x, y: last.y + current.y };
        }, { x: 0, y: 0 });
    }

    /**
     * Returns true if the given tiles are the same
     * @param {{x: Number, y: Number}} tile1
     * @param {{x: Number, y: Number}} tile2
     * @returns {Boolean}
     */
    equalTiles(tile1, tile2) {
        return tile1.x === tile2.x && tile1.y === tile2.y;
    }


    /**
     * Returns the rectangle for the Pill at the given position
     * @param {Number} x
     * @param {Number} y
     * @returns {{x: Number, y: Number, size: Number}}
     */
    getPillRect(x, y) {
        return {
            x    : this.getTileCenter(x) - this.pillSize / 2,
            y    : this.getTileCenter(y) - this.pillSize / 2,
            size : this.pillSize
        };
    }



    /**
     * Returns a new position for a player if is at the end of the tunnel
     * @param {Number} x
     * @returns {Number}
     */
    tunnelEnds(x) {
        const tunnelStart = -tileSize / 2;
        const tunnelEnd   = tileSize * this.cols + tunnelStart;

        if (x < tunnelStart) {
            return tunnelEnd;
        }
        if (x > tunnelEnd) {
            return tunnelStart;
        }
        return x;
    }

    /**
     * Returns true if there is a wall at the given position
     * @param {Number} col
     * @param {Number} row
     * @returns {Boolean}
     */
    inBoard(col, row) {
        return row >= 0 && col >= 0 && row < this.rows && col < this.cols;
    }

    /**
     * Returns true if there is a wall at the given position
     * @param {Number} col
     * @param {Number} row
     * @returns {Boolean}
     */
    isWall(col, row) {
        return boardMatrix[row][col] === wallValue;
    }

    /**
     * Returns true if there is an intersection at the given position
     * @param {Number} col
     * @param {Number} row
     * @returns {Boolean}
     */
    isIntersection(col, row) {
        return boardMatrix[row][col] === interValue || boardMatrix[row][col] === interPillValue;
    }

    /**
     * Returns true if there is a tunnel at the given position
     * @param {Number} col
     * @param {Number} row
     * @returns {Boolean}
     */
    isTunnel(col, row) {
        return boardMatrix[row][col] === tunnelValue;
    }

    /**
     * Returns true if there can be a pill at the given position
     * @param {Number} col
     * @param {Number} row
     * @returns {Boolean}
     */
    hasPill(col, row) {
        return boardMatrix[row][col] === pillPathValue || boardMatrix[row][col] === interPillValue;
    }



    /**
     * Returns all the board turns
     * @returns {Object}
     */
    get boardTurns() {
        return boardTurns;
    }

    /**
     * Returns all the possible turns at a given position
     * @param {String} pos
     * @returns {Number[]}
     */
    getTurns(pos) {
        return boardTurns[pos] || null;
    }



    /**
     * Converts a x,y object into a string
     * @param {{x: Number, y: Number}} tile
     * @returns {String}
     */
    tileToString(tile) {
        return `x${tile.x}y${tile.y}`;
    }

    /**
     * Transforms a number into an x,y direction
     * @param {Number} value
     * @returns {{x: Number, y: Number}}
     */
    numberToDir(value) {
        switch (value) {
        case 0:
            return { x:  0, y: -1 };   // Up
        case 1:
            return { x: -1, y:  0 };   // Left
        case 2:
            return { x:  0, y:  1 };   // Down
        case 3:
            return { x:  1, y:  0 };   // Right
        }
    }

    /**
     * Transforms an x,y direction into a number
     * @param {{x: Number, y: Number}} dir
     * @returns {Number}
     */
    dirToNumber(dir) {
        switch (this.tileToString(dir)) {
        case "x0y-1":
            return 0;   // Up
        case "x-1y0":
            return 1;   // Left
        case "x0y1":
            return 2;   // Down
        case "x1y0":
            return 3;   // Right
        }
    }

    /**
     * Returns an object of numbers used in drawing
     * @return {Object}
     */
    get numbers() {
        return {
            n18 : this.tileSize * 1.5,
            n17 : this.tileSize * 1.4166,
            n16 : this.tileSize * 1.3333,
            n15 : this.tileSize * 1.25,
            n14 : this.tileSize * 1.1666,
            n13 : this.tileSize * 1.0833,
            n12 : this.tileSize,
            n11 : this.tileSize * 0.9166,
            n10 : this.tileSize * 0.8333,
            n9  : this.tileSize * 0.75,
            n8  : this.tileSize * 0.6666,
            n7  : this.tileSize * 0.5833,
            n6  : this.tileSize * 0.5,
            n5  : this.tileSize * 0.4166,
            n4  : this.tileSize * 0.3333,
            n3  : this.tileSize * 0.25,
            n2  : this.tileSize * 0.1666,
            n1  : this.tileSize * 0.0833,

            r1  : this.tileSize * 0.25,
            r2  : this.tileSize * 0.125,
        };
    }
}

/**
 * Pacman Animation
 */
class Animation {

    /**
     * Pacman Animation constructor
     * @param {Board}     board
     * @param {Function=} callback
     */
    constructor(board, callback = null) {
        this.board    = board;
        this.canvas   = board.screenCanvas;
        this.ctx      = this.canvas.ctx;
        this.callback = callback;

        this.time     = 0;
        this.endTime  = 0;
        this.clearAll = false;
    }



    /**
     * Increases the timer
     * @param {Number} time
     * @returns {Void}
     */
    incTimer(time) {
        this.time += time;
    }

    /**
     * Returns true if the animation hasn't ended
     * @returns {Boolean}
     */
    get isAnimating() {
        return this.endTime > this.time;
    }

    /**
     * Does the Animation
     * @returns {Void}
     */
    animate() {
        return undefined;
    }

    /**
     * Called when the animation ends
     * @returns {Void}
     */
    onEnd() {
        if (this.canvas) {
            if (this.clearAll) {
                this.canvas.clear();
            } else {
                this.canvas.clearSavedRects();
            }
        }

        if (this.callback) {
            this.callback();
        }
    }
}

/**
 * Pacman Blob
 */
class Blob {

    /**
     * Pacman Blob constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board = board;
        this.level = board.level;
        this.init(board.gameCanvas);
    }

    /**
     * Initializes the Blob
     * @param {Canvas} canvas
     * @returns {Void}
     */
    init(canvas) {
        this.canvas     = canvas;
        this.ctx        = canvas.ctx;

        this.tile       = this.board.startingPos;
        this.tileCenter = this.board.getTileXYCenter(this.tile);
        this.x          = this.tileCenter.x;
        this.y          = this.tileCenter.y;
        this.dir        = this.board.startingDir;
        this.speed      = this.level.getNumber("pmSpeed");
        this.center     = true;
        this.turn       = null;
        this.delta      = null;
        this.mouth      = 5;
        this.radius     = this.board.blobRadius;
        this.sound      = 1;
    }



    /**
     * Animates the Blob
     * @param {Number} speed
     * @returns {Boolean}
     */
    animate(speed) {
        let newTile = false;
        if (this.center && this.crashed()) {
            this.mouth = 5;
        } else if (this.delta) {
            newTile = this.cornering(speed);
        } else {
            newTile = this.move(speed);
        }
        this.draw();
        return newTile;
    }

    /**
     * Moves the Blob
     * @param {Number} speed
     * @returns {Boolean}
     */
    move(speed) {
        this.x += this.dir.x * this.speed * speed;
        this.y += this.dir.y * this.speed * speed;

        this.moveMouth();
        this.newTile();
        const newTile = this.atCenter();

        this.x = this.board.tunnelEnds(this.x);
        return newTile;
    }

    /**
     * Changes the state of the Blob's mouth
     * @returns {Void}
     */
    moveMouth() {
        this.mouth = (this.mouth + 1) % 20;
    }

    /**
     * The Blob might have entered a new Tile, and several things might need to be done
     * @returns {Void}
     */
    newTile() {
        const tile = this.board.getTilePos(this.x, this.y);
        if (!this.board.equalTiles(this.tile, tile)) {
            this.tile       = tile;
            this.tileCenter = this.board.getTileXYCenter(tile);
            this.center     = false;

            if (this.turn && this.inBoard(this.turn) && !this.isWall(this.turn)) {
                this.delta = {
                    x : this.dir.x || this.turn.x,
                    y : this.dir.y || this.turn.y,
                };
            }
        }
    }

    /**
     * Does the turning or wall crash when the Blob is at, or just passed, the center of a tile
     * @returns {Boolean}
     */
    atCenter() {
        if (!this.center && this.passedCenter()) {
            let turn = false;
            if (this.turn && this.inBoard(this.turn) && !this.isWall(this.turn)) {
                this.dir  = this.turn;
                this.turn = null;
                turn      = true;
            }
            if (turn || this.crashed()) {
                this.x = this.tileCenter.x;
                this.y = this.tileCenter.y;
            }
            this.center = true;

            return true;
        }
        return false;
    }



    /**
     * Does a faster turn by turnning a bit before the corner.
     * Only when a turn is asked before reaching an intersection
     * @param {Number} speed
     * @returns {Boolean}
     */
    cornering(speed) {
        this.x += this.delta.x * this.speed * speed;
        this.y += this.delta.y * this.speed * speed;

        if (this.passedCenter()) {
            if (this.dir.x) {
                this.x = this.tileCenter.x;
            }
            if (this.dir.y) {
                this.y = this.tileCenter.y;
            }
            this.dir   = this.turn;
            this.turn  = null;
            this.delta = null;

            return true;
        }
        return false;
    }

    /**
     * Eats food (dots, energizers, fruits)
     * @param {Boolean} atPill
     * @param {Boolean} frightenGhosts
     * @returns {Void}
     */
    onEat(atPill, frightenGhosts) {
        if (!atPill) {
            this.sound = 1;
        }
        let key;
        if (frightenGhosts) {
            key = atPill ? "eatingFrightSpeed" : "pmFrightSpeed";
        } else {
            key = atPill ? "eatingSpeed" : "pmSpeed";
        }
        this.speed = this.level.getNumber(key);
    }

    /**
     * Returns the apropiate sound effect
     * @returns {String}
     */
    getSound() {
        this.sound = (this.sound + 1) % 2;
        return this.sound ? "eat2" : "eat1";
    }

    /**
     * New direction (given by the user)
     * @param {{x: Number, y: Number}} turn
     * @returns {Void}
     */
    makeTurn(turn) {
        if (this.delta) {
            return;
        }
        if (this.turnNow(turn)) {
            this.dir    = turn;
            this.turn   = null;
            this.center = false;
        } else {
            this.turn = turn;
        }
    }



    /**
     * Draws a Blob with the given data
     * @returns {Void}
     */
    draw() {
        const values = [ 0, 0.2, 0.4, 0.2 ];
        const mouth  = Math.floor(this.mouth / 5);
        const delta  = values[mouth];

        this.savePos();
        this.ctx.save();
        this.ctx.fillStyle = "rgb(255, 255, 51)";
        this.ctx.translate(Math.round(this.x), Math.round(this.y));
        this.ctx.rotate(this.getAngle());
        this.ctx.beginPath();
        this.ctx.arc(0, 0, this.radius, (1 + delta) * Math.PI, (3 - delta) * Math.PI);
        this.ctx.lineTo(Math.round(this.radius / 3), 0);
        this.ctx.fill();
        this.ctx.restore();
    }

    /**
     * Saves the Blob's position to delete clear it before the next animation
     * @returns {Void}
     */
    savePos() {
        this.canvas.savePos(this.x, this.y);
    }

    /**
     * Draws the next step in the Blob's death animation
     * @param {CanvasRenderingContext2D} ctx
     * @param {Number}                   count
     * @returns {Void}
     */
    drawDeath(ctx, count) {
        const delta = count / 50;

        ctx.fillStyle = "rgb(255, 255, 51)";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, (1.5 - delta) * Math.PI, (1.5 + delta) * Math.PI, true);
        ctx.lineTo(0, 0);
        ctx.fill();
    }

    /**
     * Draws a circle as the next step in the Blob Death animation
     * @param {CanvasRenderingContext2D} ctx
     * @param {Number}                   count
     * @returns {Void}
     */
    drawCircle(ctx, count) {
        const radius = Math.round(count / 2);

        ctx.strokeStyle = "rgb(159, 159, 31)";
        ctx.lineWidth   = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, 2 * Math.PI, true);
        ctx.stroke();
    }



    /**
     * Returns true if the Blob crashed with a wall
     * @returns {Boolean}
     */
    crashed() {
        return this.inBoard(this.dir) && this.isWall(this.dir);
    }

    /**
     * Returns true if the Blob has passed the center of the currrent tile
     * @returns {Boolean}
     */
    passedCenter() {
        return (
            (this.dir.x ===  1 && this.x >= this.tileCenter.x) ||
            (this.dir.x === -1 && this.x <= this.tileCenter.x) ||
            (this.dir.y ===  1 && this.y >= this.tileCenter.y) ||
            (this.dir.y === -1 && this.y <= this.tileCenter.y)
        );
    }

    /**
     * Returns true if the Blob has to turn now
     * @param {{x: Number, y: Number}} turn
     * @returns {Boolean}
     */
    turnNow(turn) {
        return (
            (!this.dir.x && !turn.x) || (!this.dir.y && !turn.y) ||  // Half Turn
            (this.center && this.crashed() && this.inBoard(turn) && !this.isWall(turn))    // Crash Turn
        );
    }

    /**
     * Returns true if the next tile is a wall
     * @param {{x: Number, y: Number}} turn
     * @returns {Boolean}
     */
    isWall(turn) {
        const tile = this.board.sumTiles(this.tile, turn);
        return this.board.isWall(tile.x, tile.y);
    }

    /**
     * Returns true if the next tile is a wall
     * @param {{x: Number, y: Number}} turn
     * @returns {Boolean}
     */
    inBoard(turn) {
        const tile = this.board.sumTiles(this.tile, turn);
        return this.board.inBoard(tile.x, tile.y);
    }

    /**
     * Returns the angle of the Blob using its direction
     * @returns {Number}
     */
    getAngle() {
        let angle;
        if (this.dir.x === -1) {
            angle = 0;
        } else if (this.dir.x ===  1) {
            angle = Math.PI;
        } else if (this.dir.y === -1) {
            angle = 0.5 * Math.PI;
        } else if (this.dir.y ===  1) {
            angle = 1.5 * Math.PI;
        }
        return angle;
    }
}

/**
 * Pacman Death Animation
 * @extends {Animation}
 */
class DeathAnimation extends Animation {

    /**
     * Pacman Death Animation constructor
     * @param {Board}    board
     * @param {Function} callback
     * @param {Blob}     blob
     */
    constructor(board, callback, blob) {
        super(board, callback);

        this.blob       = blob;
        this.blocksGame = true;
        this.endTime    = 1350;
        this.x          = blob.x;
        this.y          = blob.y;
    }



    /**
     * Does the Death animation
     * @returns {Void}
     */
    animate() {
        const count = Math.round(this.time / 15);

        this.canvas.clearSavedRects();
        this.ctx.save();
        this.ctx.translate(this.x, this.y);

        if (this.time < 750) {
            this.blob.drawDeath(this.ctx, count);
        } else if (this.time < 1050) {
            this.blob.drawCircle(this.ctx, count - 50);
        } else {
            this.blob.drawCircle(this.ctx, count - 70);
        }

        this.ctx.restore();
        this.canvas.savePos(this.x, this.y);
    }
}

/**
 * Pacman End Level Animation
 * @extends {Animation}
 */
class EndLevelAnimation extends Animation {

    /**
     * Pacman End Level Animation constructor
     * @param {Board}    board
     * @param {Function} callback
     */
    constructor(board, callback) {
        super(board, callback);

        this.blinks     = 0;
        this.blocksGame = true;
        this.blinkTimer = 150;
        this.endTime    = 1600;
    }



    /**
     * Does the End Level animation
     * @returns {Void}
     */
    animate() {
        if (this.time > this.blinkTimer) {
            this.board.boardCanvas.clear();
            this.board.drawBoard(this.blinks % 2 === 0);
            this.blinks     += 1;
            this.blinkTimer += 150;
        }
    }
}

/**
 * Pacman Paused Animation
 * @extends {Animation}
 */
class PausedAnimation extends Animation {

    /**
     * Pacman Paused Animation constructor
     * @param {Board} board
     */
    constructor(board) {
        super(board);

        this.blocksGame = true;
        this.timePart   = 500;
        this.partDiv    = 5;
        this.maxSize    = 2.2;
        this.minSize    = 1.5;
        this.clearAll   = true;
    }



    /**
     * Returns true if the animation hasn't ended
     * @returns {Boolean}
     */
    get isAnimating() {
        return true;
    }

    /**
     * Animates the Paused text alternating sizes increases and decreases
     * @returns {Void}
     */
    animate() {
        const time = this.time % this.timePart;
        const anim = Math.floor(this.time / this.timePart) % 2;
        const part = time * (this.maxSize - this.minSize) / this.timePart;
        const size = anim ? this.maxSize - part : this.minSize + part;

        this.canvas.clear();
        this.canvas.fill(0.8);

        this.canvas.drawText({
            size  : size,
            color : "rgb(255, 255, 51)",
            text  : "Paused!",
            pos   : { x: 14, y: this.board.centerTextTop },
            alpha : 0.8,
            align : null,
        });
    }
}

/**
 * Pacman Animations
 */
class Animations {

    /**
     * Pacman Animations constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board      = board;
        this.canvas     = board.screenCanvas;
        this.animations = [];
    }



    /**
     * Returns true if there is an animation
     * @returns {Boolean}
     */
    get isAnimating() {
        return this.animations.length &&
            this.animations.some((anim) => anim.blocksGame);
    }

    /**
     * Animates the current animation, if possible
     * @param {Number} time
     * @returns {Void}
     */
    animate(time) {
        if (this.animations.length) {
            this.animations.forEach((animation, index, object) => {
                animation.incTimer(time);
                if (animation.isAnimating) {
                    animation.animate();
                } else {
                    animation.onEnd();
                    object.splice(index, 1);
                }
            });
        }
    }

    /**
     * Ends all the Animations
     * @returns {Void}
     */
    endAll() {
        this.animations.forEach((anim) => anim.onEnd());
        this.animations = [];
    }

    /**
     * Adds a new animation
     * @param {*} animation
     * @returns {Void}
     */
    add(animation) {
        this.animations.push(animation);
    }



    /**
     * Creates the Ready Animation
     * @param {Function} callback
     * @returns {Void}
     */
    ready(callback) {
        this.add(new ReadyAnimation(this.board, callback));
    }

    /**
     * Creates the Paused Animation
     * @returns {Void}
     */
    paused() {
        this.add(new PausedAnimation(this.board));
    }

    /**
     * Creates the Blob's Death Animation
     * @param {Blob}     blob
     * @param {Function} callback
     * @returns {Void}
     */
    death(blob, callback) {
        this.add(new DeathAnimation(this.board, callback, blob));
    }

    /**
     * Creates the Game Over Animation
     * @param {Function} callback
     * @returns {Void}
     */
    gameOver(callback) {
        this.add(new GameOverAnimation(this.board, callback));
    }

    /**
     * Creates the Ghost Score Animation
     * @param {String} score
     * @param {{x: Number, y: Number}} pos
     * @returns {Void}
     */
    ghostScore(score, pos) {
        this.add(new GhostScoreAnimation(this.board, score, pos));
    }

    /**
     * Creates the Fruit Score Animation
     * @param {String} score
     * @param {{x: Number, y: Number}} pos
     * @returns {Void}
     */
    fruitScore(score, pos) {
        this.add(new FruitScoreAnimation(this.board, score, pos));
    }

    /**
     * Creates the End Level Animation
     * @param {Function} callback
     * @returns {Void}
     */
    endLevel(callback) {
        this.add(new EndLevelAnimation(this.board, callback));
    }

    /**
     * Creates the New Level Animation
     * @param {Number}   level
     * @param {Function} callback
     * @returns {Void}
     */
    newLevel(level, callback) {
        this.add(new NewLevelAnimation(this.board, callback, level));
    }
}

/**
 * Pacman Big Blob
 * @extends {Blob}
 */
class BigBlob extends Blob {

    /**
     * Pacman Big Blob constructor
     * @param {Board} board
     */
    constructor(board) {
        super(board);

        this.ctx    = board.screenCanvas.ctx;
        this.radius = DemoData.title.blobRadius * board.tileSize;
        this.x      = -this.radius;
        this.y      = DemoData.title.blobY * board.tileSize;
        this.dir    = Object.create(DemoData.title.blobDir);
        this.mouth  = DemoData.title.blobMouth;
        this.timer  = 0;

        this.endPos = DemoData.title.endTile * board.tileSize;
    }



    /**
     * Moves the Big Blob. Specially made for the title animation
     * @param {Number} time
     * @returns {Boolean}
     */
    animate(time) {
        this.timer += time;
        this.x      = Math.round(this.timer * this.endPos / DemoData.title.endTime);

        this.moveMouth();
        this.draw();
        return false;
    }

    /**
     * When the Blob reaches it positions, it draws it there
     * @returns {Void}
     */
    endAnimation() {
        this.mouth = DemoData.title.blobMouth;
        this.x     = this.endPos;
        this.draw();
    }

    /**
     * Removes the Canvas Save pos, since is not required
     * @returns {Void}
     */
    savePos() {
        return undefined;
    }
}

/**
 * Pacman Food
 */
class Food {

    /**
     * Pacman Food constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board = board;
        this.level = board.level;
        this.ctx   = board.boardCanvas.ctx;

        this.init();
        this.createMatrix();
        this.createEnergizers();
    }

    /**
     * Initializes the instance
     * @returns {Void}
     */
    init() {
        this.total      = this.board.pillAmount;
        this.minRadius  = this.board.pillSize;
        this.maxRadius  = this.board.energizerSize;
        this.radius     = this.maxRadius;
        this.energizers = [];
        this.matrix     = [];
        this.mult       = -1;
    }

    /**
     * Creates a Matrix with the positions of the pills and energizers
     * @returns {Void}
     */
    createMatrix() {
        for (let i = 0; i < this.board.rows; i += 1) {
            this.matrix[i] = [];
            for (let j = 0; j < this.board.cols; j += 1) {
                this.matrix[i][j] = this.board.hasPill(j, i) ? this.level.pillValue : 0;
            }
        }

        this.board.energizers.forEach((pos) => {
            this.matrix[pos.y][pos.x] = this.level.energizerValue;
        });
    }

    /**
     * Creates a list with only the active energizers
     * @returns {Void}
     */
    createEnergizers() {
        this.energizers = [];

        this.board.energizers.forEach((pos) => {
            if (this.matrix[pos.y][pos.x] === this.level.energizerValue) {
                this.energizers.push(this.board.getTileXYCenter(pos));
            }
        });
    }



    /**
     * Does the Enerigizers animation
     * @returns {Void}
     */
    wink() {
        this.calcRadius();
        this.drawEnergizers();
    }

    /**
     * Calculates the Radius for the Energizers
     * @returns {Void}
     */
    calcRadius() {
        this.radius += this.mult * 0.1;

        if (this.radius <= this.minRadius) {
            this.mult = 1;
        } else if (this.radius >= this.maxRadius) {
            this.mult = -1;
        }
    }



    /**
     * Draws all the Pills and Energizers in the board
     * @returns {Void}
     */
    draw() {
        this.drawPills();
        this.drawEnergizers();
    }

    /**
     * Draws all the Pills in the board
     * @returns {Void}
     */
    drawPills() {
        this.ctx.save();
        this.ctx.fillStyle = "white";

        this.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                const rect = this.board.getPillRect(x, y);
                if (value === this.level.pillValue) {
                    this.ctx.fillRect(rect.x, rect.y, rect.size, rect.size);
                }
            });
        });
        this.ctx.restore();
    }

    /**
     * Clears a Pill at the given position
     * @param {Number} x
     * @param {Number} y
     * @returns {Void}
     */
    clearPill(x, y) {
        const rect = this.board.getPillRect(x, y);
        this.ctx.clearRect(rect.x, rect.y, rect.size, rect.size);
    }

    /**
     * Draws all the remaining Energizers with the given radius
     * @returns {Void}
     */
    drawEnergizers() {
        this.energizers.forEach((pos) => {
            this.clearEnergizer(pos.x, pos.y);
            this.drawEnergizer(pos.x, pos.y, this.radius);
        });
    }

    /**
     * Draws an Energizer at the given position with the given radius
     * @param {Number} x
     * @param {Number} y
     * @param {Number} radius
     * @returns {Void}
     */
    drawEnergizer(x, y, radius) {
        this.ctx.save();
        this.ctx.fillStyle = "white";
        this.ctx.beginPath();
        this.ctx.arc(x, y, radius, 0, 2 * Math.PI);
        this.ctx.fill();
        this.ctx.restore();
    }

    /**
     * Clears an Energizer at the given position
     * @param {Number} x
     * @param {Number} y
     * @returns {Void}
     */
    clearEnergizer(x, y) {
        const radius = this.maxRadius;
        this.ctx.clearRect(x - radius, y - radius, radius * 2, radius * 2);
    }



    /**
     * Returns true if there is a Pill at the given cell
     * @param {{x: Number, y: Number}} tile
     * @returns {Boolean}
     */
    isAtPill(tile) {
        return this.matrix[tile.y][tile.x] > 0;
    }

    /**
     * The Blob eats the Pill at the given cell. Returns the value of the pill. 1 for dot, 5 for energizer
     * @param {{x: Number, y: Number}} tile
     * @returns {Number}
     */
    eatPill(tile) {
        const value = this.matrix[tile.y][tile.x];
        const pos   = this.board.getTileXYCenter(tile);

        this.clearPill(tile.x, tile.y);
        this.matrix[tile.y][tile.x] = 0;
        this.total -= 1;

        if (value === this.level.energizerValue) {
            this.clearEnergizer(pos.x, pos.y);
            this.createEnergizers();
        }
        return value;
    }

    /**
     * Returns the amount of Pîlls left
     * @returns {Number}
     */
    getLeftPills() {
        return this.total;
    }
}

// Utils




/**
 * Pacman Ghost
 */
class Ghost {

    /**
     * Pacman Ghost constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board       = board;
        this.level       = board.level;

        this.color       = "";
        this.paths       = {};
        this.inPen       = false;
        this.start       = { x: 0, y: 0 };
        this.scatter     = { x: 0, y: 0 };

        this.elroyMode   = 0;
        this.activeElroy = false;
    }

    /**
     * Initializes the Ghost
     * @param {Canvas}  canvas
     * @param {?Number} dots
     * @returns {Void}
     */
    init(canvas, dots) {
        this.canvas     = canvas;
        this.ctx        = canvas.ctx;

        this.mode       = "scatter";
        this.tile       = this.board.getGhostStartTile(this.inPen);
        this.tileCenter = this.board.getTileXYCenter(this.tile);
        this.turn       = this.board.getGhostStartTurn(this.inPen);
        this.x          = this.start.x * this.board.tileSize;
        this.y          = this.start.y * this.board.tileSize;
        this.center     = false;
        this.dotsCount  = dots || 0;
        this.target     = this.scatter;
        this.speed      = this.level.getGhostSpeed(this.inPen);
        this.feet       = 0;
        this.path       = null;
        this.pathName   = null;
        this.pathStep   = 0;

    }

    /**
     * Switches the Ghost mode
     * @param {String} oldMode
     * @param {String} newMode
     * @param {Blob}   blob
     * @returns {Void}
     */
    switchMode(oldMode, newMode, blob) {
        if (!this.dontSwitch(oldMode)) {
            this.mode   = newMode;
            this.target = this.getTarget(blob);
            this.speed  = this.calcSpeed();

            if (!this.dontHalfTurn(oldMode)) {
                if (this.path === null) {
                    this.turn = {
                        x : this.dir.x * -1,
                        y : this.dir.y * -1
                    };
                } else {
                    this.turn = { x: 1, y: 0 };
                }
            }
        }
    }

    /**
     * Moves the Ghost
     * @param {Number} speed
     * @param {Blob}   blob
     * @param {String} switchMode
     * @returns {Boolean}
     */
    move(speed, blob, switchMode) {
        let addToPen = false;
        this.x += this.dir.x * this.speed * speed;
        this.y += this.dir.y * this.speed * speed;

        if (this.path !== null) {
            addToPen = this.pathMove(blob, switchMode);
        } else {
            this.normalMove(blob);
        }

        this.moveFeet();
        this.draw();
        return addToPen;
    }

    /**
     * Moves the Ghost in a predefined path
     * @param {Blob}   blob
     * @param {String} switchMode
     * @returns {Boolean}
     */
    pathMove(blob, switchMode) {
        const step = this.path[this.pathStep];
        if (this.passedDist) {
            if (this.dir.x) {
                this.x = step.targetX * this.board.tileSize;
            }
            if (this.dir.y) {
                this.y = step.targetY * this.board.tileSize;
            }

            if (step.next !== null) {
                this.pathStep = step.next;
                this.dir      = this.path[this.pathStep].dir;

            } else if (this.pathName === "exitPen") {
                this.path  = null;
                this.dir   = this.turn;
                this.turn  = null;
                this.speed = this.level.getGhostSpeed(false);

            } else if (this.pathName === "enterPen") {
                this.mode       = switchMode;
                this.target     = this.getTarget(blob);
                this.tile       = this.board.getGhostStartTile(false);
                this.tileCenter = this.board.getTileXYCenter(this.tile);
                this.turn       = this.board.getGhostStartTurn(true);
                return true;
            }
        }
        return false;
    }

    /**
     * Moves the Ghost around the board
     * @param {Blob} blob
     * @returns {Void}
     */
    normalMove(blob) {
        this.newTile(blob);
        this.x = this.board.tunnelEnds(this.x);

        if (!this.center && this.passedCenter) {
            if (this.turn) {
                this.makeTurn();
            }
            if (this.isNextIntersection) {
                this.decideTurn();
            }
            this.speed  = this.calcSpeed();
            this.center = true;
        }
    }

    /**
     * The Ghost moved to a new Tile
     * @param {Blob} blob
     * @returns {Void}
     */
    newTile(blob) {
        const tile = this.board.getTilePos(this.x, this.y);
        if (!this.board.equalTiles(this.tile, tile)) {
            this.tile       = tile;
            this.tileCenter = this.board.getTileXYCenter(this.tile);
            this.center     = false;

            if (this.isEnteringPen()) {
                this.setPath("enterPen");
            }
        }
    }



    /**
     * Sets the Path of the Ghost
     * @param {String} name
     * @returns {Void}
     */
    setPath(name) {
        this.pathName = name;
        this.pathStep = 0;
        this.path     = this.paths[this.pathName];
        this.dir      = this.path[this.pathStep].dir;
        this.speed    = this.level.getPathSpeed(name);
    }

    /**
     * Returns true if the Ghost is entering the Pen
     * @returns {Boolean}
     */
    isEnteringPen() {
        return this.mode === "eyes" && this.board.equalTiles(this.tile, this.board.eyesTarget);
    }



    /**
     * The Ghost turns used the previously stored turn direction
     * @returns {Void}
     */
    makeTurn() {
        this.x    = this.tileCenter.x;
        this.y    = this.tileCenter.y;
        this.dir  = this.turn;
        this.turn = null;
    }

    /**
     * The Ghost decided which direction to do next depending on different factors
     * @returns {Void}
     */
    decideTurn() {
        const turns = this.getTurns();
        if (turns.length === 1) {
            this.turn = turns[0];
        } else if (this.level.isFrighten(this.mode)) {
            this.turn = turns[Utils.rand(0, turns.length - 1)];
        } else {
            this.turn = this.getTargetTurn(turns);
        }
    }

    /**
     * Returns a list with all the possible turns a Ghost can do at an intersection
     * @returns {{x: Number, y: Number}[]}
     */
    getTurns() {
        const tile   = this.nextTile;
        const pos    = this.board.tileToString(tile);
        const turns  = this.board.getTurns(pos);
        const result = [];

        turns.forEach((turn) => {
            if ((turn + 2) % 4 !== this.board.dirToNumber(this.dir)) {
                result.push(this.board.numberToDir(turn));
            }
        });
        return result;
    }

    /**
     * Decides the best turn depending on which cell after the intersection is closes to the target
     * @param {{x: Number, y: Number}[]} turns
     * @returns {{x: Number, y: Number}}
     */
    getTargetTurn(turns) {
        const tile   = this.nextTile;
        let   best   = 999999;
        let   result = { x: 0, y: 0 };

        turns.forEach((turn) => {
            const ntile = this.board.sumTiles(tile, turn);
            const distx = Math.pow(this.target.x - ntile.x, 2);
            const disty = Math.pow(this.target.y - ntile.y, 2);
            const dist  = Math.sqrt(distx + disty);

            if (dist < best) {
                best   = dist;
                result = turn;
            }
        });
        return result;
    }

    /**
     * Checks if the Ghost and the Blob are in the same tile and when those
     * are the same depending on the Ghost's mode, it can kill the blob or die
     * @param {{x: Number, y: Number}} blobTile
     * @returns {String}
     */
    killOrDie(blobTile) {
        if (this.board.equalTiles(this.tile, blobTile) && !this.path) {
            if (this.level.isFrighten(this.mode)) {
                this.mode   = "eyes";
                this.target = this.board.eyesTarget;
                this.speed  = this.level.eyesSpeed;
                return "kill";

            } else if (this.mode !== "eyes") {
                return "die";
            }
        }
    }

    /**
     * Returns true if the Ghost should change it's target
     * @param {String} globalMode
     * @returns {Boolean}
     */
    shouldChangeTarget(globalMode) {
        return this.mode !== "eyes" && (globalMode === "chase" || this.isElroy());
    }

    /**
     * Don't let the Ghost change mode on certain cases
     * @param {String} mode
     * @returns {Boolean}
     */
    dontSwitch(mode) {
        return (this.level.isFrighten(mode) && !this.level.isFrighten(this.mode)) || this.mode === "eyes";
    }

    /**
     * Don't let the Ghost half turn when switching from Blue to White mode
     * @param {String} mode
     * @returns {Boolean}
     */
    dontHalfTurn(mode) {
        return mode === "blue" || mode === "white";
    }

    /**
     * Returns the Ghost's Speed based on diferent factors
     * @returns {Number}
     */
    calcSpeed() {
        let speed = this.level.getGhostSpeed(false);
        if (this.mode === "eyes") {
            speed = this.level.eyesSpeed;
        } else if (this.level.isFrighten(this.mode)) {
            speed = this.level.getNumber("ghostFrightSpeed");
        } else if (this.board.isTunnel(this.tile.x, this.tile.y)) {
            speed = this.level.getNumber("tunnelSpeed");
        } else if (this.isElroy()) {
            speed = this.level.getNumber(`elroySpeed${this.elroyMode}`);
        }
        return speed;
    }

    /**
     * Returns true if the Ghost moved past certain distance stored in the Path
     * @returns {Boolean}
     */
    get passedDist() {
        const path = this.path[this.pathStep];
        return (
            (this.dir.x ===  1 && this.x >= path.targetX * this.board.tileSize) ||
            (this.dir.x === -1 && this.x <= path.targetX * this.board.tileSize) ||
            (this.dir.y ===  1 && this.y >= path.targetY * this.board.tileSize) ||
            (this.dir.y === -1 && this.y <= path.targetY * this.board.tileSize)
        );
    }

    /**
     * Returns true if the Ghost passed the center of the tile
     * @returns {Boolean}
     */
    get passedCenter() {
        return (
            (this.dir.x ===  1 && this.x >= this.tileCenter.x) ||
            (this.dir.x === -1 && this.x <= this.tileCenter.x) ||
            (this.dir.y ===  1 && this.y >= this.tileCenter.y) ||
            (this.dir.y === -1 && this.y <= this.tileCenter.y)
        );
    }

    /**
     * Returns the next tile
     * @returns {{x: Number, y: Number}}
     */
    get nextTile() {
        return this.board.sumTiles(this.tile, this.dir);
    }

    /**
     * Returns true if the next tile is an intersection
     * @returns {Boolean}
     */
    get isNextIntersection() {
        const tile = this.nextTile;
        return this.board.isIntersection(tile.x, tile.y);
    }

    /**
     * Returns the Ghost's target depending on the current mode
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    getTarget(blob) {
        if (this.mode === "chase" || this.isElroy()) {
            return this.chase(blob);
        }
        return this.scatter;
    }



    /**
     * Each ghost implements its own chase function
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    chase(blob) {
        return { x: 0, y: 0 };
    }

    /**
     * Returns true if the Ghost is in "Cruise Elroy" Mode. Only used for Blinky
     * @returns {Boolean}
     */
    isElroy() {
        return false;
    }

    /**
     * Makes it possible for a Ghost to switch to "Cruise Elroy" Mode. Only used for Blinky
     * @returns {Void}
     */
    activateElroy() {
        return undefined;
    }

    /**
     * Increases the internal pills count of a Ghost
     * @returns {Void}
     */
    increaseDots() {
        this.dotsCount += 1;
    }

    /**
     * Sets the Chase target of the Ghost
     * @param {Blob} blob
     * @returns {Void}
     */
    setChaseTarget(blob) {
        this.target = this.chase(blob);
    }

    /**
     * Changes the Drawing for the Ghosts feet
     * @returns {Void}
     */
    moveFeet() {
        this.feet = (this.feet + 0.3) % 2;
    }



    /**
     * Draws the Ghost
     * @returns {Void}
     */
    draw() {
        const center = this.board.ghostSize / 2;
        this.canvas.savePos(this.x, this.y);
        this.ctx.save();
        this.ctx.translate(Math.round(this.x) - center, Math.round(this.y) - center);

        this.ghostBody();
        if (this.level.isFrighten(this.mode)) {
            this.ghostFrightenFace();
        } else {
            this.ghostNormalFace();
        }
        this.ctx.restore();
    }

    /**
     * Draws the Ghost's Body
     * @returns {Void}
     */
    ghostBody() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = this.bodyColor;
        this.ctx.beginPath();
        this.ctx.arc(nums.n8, nums.n8, nums.n8, Math.PI, 1.5 * Math.PI, false);
        this.ctx.arc(nums.n10, nums.n8, nums.n8, 1.5 * Math.PI, 2 * Math.PI, false);

        if (!Math.floor(this.feet)) {
            this.ghostFeet(true);
        } else {
            this.ghostFeet(false);
        }
        this.ctx.fill();
    }

    /**
     * Draws one of the variations of the Ghost's Feet
     * @param {Boolean} firstVariant
     * @returns {Void}
     */
    ghostFeet(firstVariant) {
        const nums   = this.board.numbers;
        const first  = firstVariant ? nums.n16 : nums.n18;
        const second = firstVariant ? nums.n18 : nums.n16;

        this.ctx.lineTo(nums.n18, first);
        this.ctx.lineTo(nums.n15, second);
        this.ctx.lineTo(nums.n13, first);
        this.ctx.lineTo(nums.n11, second);
        this.ctx.lineTo(nums.n9, first);
        this.ctx.lineTo(nums.n7, second);
        this.ctx.lineTo(nums.n5, first);
        this.ctx.lineTo(nums.n3, second);
        this.ctx.lineTo(0, first);
        this.ctx.lineTo(0, nums.n8);
    }

    /**
     * Draws the Ghost's Face for the Chase/Scatter/Eyes modes
     * @returns {Void}
     */
    ghostNormalFace() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(255, 255, 255)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n6  + this.dir.x * nums.n2, nums.n7 + this.dir.y * nums.n2, nums.r1, 0, 2 * Math.PI);
        this.ctx.arc(nums.n12 + this.dir.x * nums.n2, nums.n7 + this.dir.y * nums.n2, nums.r1, 0, 2 * Math.PI);
        this.ctx.fill();

        this.ctx.fillStyle = "rgb(0, 51, 255)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n6  + this.dir.x * nums.n4, nums.n7 + this.dir.y * nums.n4, nums.r2, 0, 2 * Math.PI);
        this.ctx.arc(nums.n12 + this.dir.x * nums.n4, nums.n7 + this.dir.y * nums.n4, nums.r2, 0, 2 * Math.PI);
        this.ctx.fill();
    }

    /**
     * Draws the Ghost's Face for the Frighten (Blue/White) modes
     * @returns {Void}
     */
    ghostFrightenFace() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = this.faceColor;
        this.ctx.beginPath();
        this.ctx.arc(nums.n6,  nums.n7, nums.r2, 0, 2 * Math.PI);
        this.ctx.arc(nums.n12, nums.n7, nums.r2, 0, 2 * Math.PI);
        this.ctx.fill();

        this.ctx.strokeStyle = this.faceColor;
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n3, nums.n13);
        this.ctx.lineTo(nums.n5, nums.n11);
        this.ctx.lineTo(nums.n7, nums.n13);
        this.ctx.lineTo(nums.n9, nums.n11);
        this.ctx.lineTo(nums.n11, nums.n13);
        this.ctx.lineTo(nums.n13, nums.n11);
        this.ctx.lineTo(nums.n15, nums.n13);
        this.ctx.stroke();
    }

    /**
     * Returns the color for the Ghosts body depending on the mode
     * @returns {String}
     */
    get bodyColor() {
        switch (this.mode) {
        case "blue":
            return "rgb(0, 51, 255)";
        case "white":
            return "rgb(255, 255, 255)";
        case "eyes":
            return "rgb(0, 0, 0)";
        default:
            return this.color;
        }
    }

    /**
     * Returns the color used for the Ghosts face depending on the mode
     * @returns {String}
     */
    get faceColor() {
        return this.mode === "blue" ? "rgb(255, 255, 255)" : "rgb(255, 0, 0)";
    }
}

/**
 * Pacman Demo Ghost
 * @extends {Ghost}
 */
class DemoGhost extends Ghost {

    /**
     * Pacman Demo Ghost constructor
     * @param {Board}  board
     * @param {String} name
     * @param {String} color
     */
    constructor(board, name, color) {
        super(board);

        this.canvas = board.screenCanvas;
        this.ctx    = this.canvas.ctx;
        this.feet   = 0;

        this.name   = name;
        this.color  = color;
    }



    /**
     * Initialize some variables for the chase demo animation
     * @param {{x: Number, y: Number}} dir
     * @param {Number}                 x
     * @param {Number}                 y
     * @returns {Void}
     */
    chaseDemo(dir, x, y) {
        this.dir   = Object.create(dir);
        this.x     = x;
        this.y     = y;
        this.mode  = "chase";
        this.speed = this.level.getGhostSpeed(false);
    }

    /**
     * Initialize some variables for the frighten demo animation
     * @param {{x: Number, y: Number}} dir
     * @param {Number}                 speed
     * @returns {Void}
     */
    frightenDemo(dir, speed) {
        this.dir   = Object.create(dir);
        this.mode  = "blue";
        this.speed = speed;
    }

    /**
     * Initialize some variables for the present demo animation
     * @param {{x: Number, y: Number}} dir
     * @returns {Void}
     */
    presentDemo(dir) {
        this.dir   = Object.create(dir);
        this.x     = -this.board.ghostSize;
        this.mode  = "chase";
        this.speed = this.level.getGhostSpeed(false);
    }

    /**
     * The animation used on the Demo
     * @param {Number} speed
     * @returns {Void}
     */
    demoAnimate(speed) {
        this.x += this.dir.x * this.speed * speed;

        this.moveFeet();
        this.draw();
    }
}

/**
 * Pacman Blinky
 * @extends {Ghost}
 */
class Blinky extends Ghost {

    /**
     * Pacman Blinky constructor
     * @param {Board}   board
     * @param {Canvas}  canvas
     * @param {?Number} dots
     */
    constructor(board, canvas, dots) {
        super(board);

        this.paths = {
            exitPen : [
                { dir : { x:  0, y: -1 }, targetY : 11.5, next : null },
            ],
            enterPen : [
                { dir : { x: -1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y:  1 }, targetY : 14.5, next : null },
            ],
        };

        this.id          = 0;
        this.start       = { x: 14, y: 11.5 };
        this.dir         = { x: -1, y:    0 };
        this.scatter     = { x: 25, y:   -3 };
        this.inPen       = false;
        this.color       = Blinky.color;
        this.activeElroy = dots !== null;

        this.init(canvas, dots);
    }

    /**
     * Returns the Ghost's name
     * @returns {String}
     */
    static get text() {
        return "Blinky";
    }

    /**
     * Returns the Ghost's color
     * @returns {String}
     */
    static get color() {
        return "rgb(221, 0, 0)";
    }



    /**
     * Blinky's target is always the current tile of the Blob
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    chase(blob) {
        return blob.tile;
    }

    /**
     * Sets Blinky's "Cruise Elroy" Mode when the number of dots left reaches the target
     * @param {Number} dots
     * @returns {Void}
     */
    checkElroyDots(dots) {
        if (dots === this.level.getNumber("elroyDotsLeft1") ||
                dots === this.level.getNumber("elroyDotsLeft2")) {
            this.elroyMode += 1;
        }
    }

    /**
     * Returns true when Blinky is in "Cruise Elroy" Mode. Only used for Blinky
     * @returns {Boolean}
     */
    isElroy() {
        return this.activeElroy && this.elroyMode > 0;
    }

    /**
     * Makes it possible for Blinky to switch to "Cruise Elroy" Mode
     * @returns {Void}
     */
    activateElroy() {
        this.activeElroy = true;
    }
}

/**
 * Pacman Pinky
 * @extends {Ghost}
 */
class Pinky extends Ghost {

    /**
     * Pacman Pinky constructor
     * @param {Board}   board
     * @param {Canvas}  canvas
     * @param {?Number} dots
     */
    constructor(board, canvas, dots) {
        super(board);

        this.paths = {
            inPen    : [
                { dir : { x:  0, y: -1 }, targetY : 14, next : 1 },
                { dir : { x:  0, y:  1 }, targetY : 15, next : 0 },
            ],
            exitPen  : [
                { dir : { x:  0, y: -1 }, targetY : 11.5, next : null },
            ],
            enterPen : [
                { dir : { x: -1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y:  1 }, targetY : 14.5, next : null },
            ],
        };

        this.id      = 1;
        this.start   = { x: 14, y: 14.5 };
        this.scatter = { x:  2, y:   -3 };
        this.inPen   = true;
        this.color   = Pinky.color;

        this.init(canvas, dots);
        this.setPath("inPen");
    }

    /**
     * Returns the Ghost's name
     * @returns {String}
     */
    static get text() {
        return "Pinky";
    }

    /**
     * Returns the Ghost's color
     * @returns {String}
     */
    static get color() {
        return "rgb(255, 153, 153)";
    }



    /**
     * Pinky's target is always 4 tiles ahead of the Blob
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    chase(blob) {
        const targety = blob.tile.y + 4 * blob.dir.y;
        let   targetx = blob.tile.x + 4 * blob.dir.x;

        // Recreating bug where Up = Up+Left
        if (blob.dir.y === -1) {
            targetx -= 4;
        }
        return { x: targetx, y: targety };
    }
}

/**
 * Pacman Inky
 * @extends {Ghost}
 */
class Inky extends Ghost {

    /**
     * Pacman Inky constructor
     * @param {Board}  board
     * @param {Canvas} canvas
     * @param {Number} dots
     * @param {Blinky} blinky
     */
    constructor(board, canvas, dots, blinky) {
        super(board);

        this.paths = {
            inPen    : [
                { dir : { x:  0, y: -1 }, targetY : 14, next : 1 },
                { dir : { x:  0, y:  1 }, targetY : 15, next : 0 },
            ],
            exitPen  : [
                { dir : { x:  1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y: -1 }, targetY : 11.5, next : null },
            ],
            enterPen : [
                { dir : { x: -1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y:  1 }, targetY : 14.5, next : 2    },
                { dir : { x: -1, y:  0 }, targetX : 12,   next : null },
            ],
        };

        this.id      = 2;
        this.start   = { x: 12, y: 14.5 };
        this.scatter = { x: 27, y:   31 };
        this.inPen   = true;
        this.color   = Inky.color;
        this.blinky  = blinky;

        this.init(canvas, dots);
        this.setPath("inPen");
    }

    /**
     * Returns the Ghost's name
     * @returns {String}
     */
    static get text() {
        return "Inky";
    }

    /**
     * Returns the Ghost's color
     * @returns {String}
     */
    static get color() {
        return "rgb(102, 255, 255)";
    }



    /**
     * Inky's target is an average of Blinky's position and the Blob's position
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    chase(blob) {
        const offsety = blob.tile.y + 2 * blob.dir.y;
        let   offsetx = blob.tile.x + 2 * blob.dir.x;

        // Recreating bug where Up = Up+Left
        if (blob.dir.y === -1) {
            offsetx -= 2;
        }
        return {
            x : offsetx * 2 - this.blinky.tile.x,
            y : offsety * 2 - this.blinky.tile.y
        };
    }
}

/**
 * Pacman Clyde
 * @extends {Ghost}
 */
class Clyde extends Ghost {

    /**
     * Pacman Clyde constructor
     * @param {Board}   board
     * @param {Canvas}  canvas
     * @param {?Number} dots
     */
    constructor(board, canvas, dots) {
        super(board);

        this.paths = {
            inPen    : [
                { dir : { x:  0, y: -1 }, targetY : 14, next : 1 },
                { dir : { x:  0, y:  1 }, targetY : 15, next : 0 },
            ],
            exitPen  : [
                { dir : { x: -1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y: -1 }, targetY : 11.5, next : null },
            ],
            enterPen : [
                { dir : { x: -1, y:  0 }, targetX : 14,   next : 1    },
                { dir : { x:  0, y:  1 }, targetY : 14.5, next : 2    },
                { dir : { x:  1, y:  0 }, targetX : 16,   next : null },
            ],
        };

        this.id      = 3;
        this.start   = { x: 16, y: 14.5 };
        this.scatter = { x:  0, y:   31 };
        this.inPen   = true;
        this.color   = Clyde.color;

        this.init(canvas, dots);
        this.setPath("inPen");
    }

    /**
     * Returns the Ghost's name
     * @returns {String}
     */
    static get text() {
        return "Clyde";
    }

    /**
     * Returns the Ghost's color
     * @returns {String}
     */
    static get color() {
        return "rgb(255, 153, 0)";
    }



    /**
     * Clyde's target is the Blob possition if is further away and the Scatter if is closer
     * @param {Blob} blob
     * @returns {{x: Number, y: Number}}
     */
    chase(blob) {
        const x = Math.pow(this.tile.x - blob.tile.x, 2);
        const y = Math.pow(this.tile.y - blob.tile.y, 2);

        if (Math.sqrt(x + y) > 8) {
            return blob.tile;
        }
        return this.scatter;
    }
}

/**
 * Pacman Demo
 */
class Demo {

    /**
     * Pacman Demo constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board   = board;
        this.level   = board.level;
        this.canvas  = board.screenCanvas;
        this.ctx     = this.canvas.ctx;

        this.step    = -1;
        this.name    = "";
        this.bigBlob = new BigBlob(this.board);
        this.food    = new DemoFood(this.board);

        this.nextAnimation();
    }



    /**
     * Destroys the current Demo and leaves it ready for the next start
     * @returns {Void}
     */
    destroy() {
        this.step    = -1;
        this.bigBlob = new BigBlob(this.board);

        this.canvas.clear();
        this.nextAnimation();
    }

    /**
     * Calls the animation the demo is at
     * @param {Number} time
     * @param {Number} speed
     * @returns {Void}
     */
    animate(time, speed) {
        switch (this.name) {
        case "title":
            this.titleAnimation(time);
            break;
        case "chase":
            this.chaseAnimation(speed);
            break;
        case "frighten":
            this.frightenAnimation(time, speed);
            break;
        case "present":
            this.presentAnimation(time, speed);
            break;
        }
    }

    /**
     * Jumps to the next animation in the demo
     * @returns {Void}
     */
    nextAnimation() {
        this.step  = this.step === DemoData.animations.length - 1 ? 1 : this.step + 1;
        this.name  = DemoData.animations[this.step];
        this.timer = 0;

        switch (this.name) {
        case "chase":
            this.initChase();
            break;
        case "frighten":
            this.initFrighten();
            break;
        case "present":
            this.initPresent();
            break;
        }
    }



    /**
     * The Title Animation
     * @param {Number} time
     * @returns {Void}
     */
    titleAnimation(time) {
        this.timer += time;
        const alpha = 1 - Math.round(10 * this.timer / DemoData.title.endTime) / 10;

        this.canvas.clear();
        this.bigBlob.animate(time);
        this.canvas.fill(alpha);

        if (this.timer > DemoData.title.endTime) {
            this.canvas.clear();
            this.drawTitle();
            this.bigBlob.endAnimation();
            this.nextAnimation();
        }
    }

    /**
     * Draws the Pacman title
     * @returns {Void}
     */
    drawTitle() {
        const left  = this.board.tileToPos(DemoData.title.leftText);
        const right = this.board.tileToPos(DemoData.title.rightText);

        this.ctx.save();
        this.ctx.font      = `6em "Whimsy TT"`;
        this.ctx.textAlign = "right";
        this.ctx.fillText("Pa", left.x, left.y);
        this.ctx.textAlign = "left";
        this.ctx.fillText("man", right.x, right.y);
        this.ctx.restore();
    }



    /**
     * Initializes the Players for the Chase animation
     * @returns {Void}
     */
    initChase() {
        const size = this.board.tileSize;
        const yPos = DemoData.chase.playersY * size;
        const dir  = DemoData.chase.playersDir;

        this.createPlayers();
        this.blob.chaseDemo(dir,       -size, yPos);
        this.blinky.chaseDemo(dir, -4 * size, yPos);
        this.pinky.chaseDemo(dir,  -6 * size, yPos);
        this.inky.chaseDemo(dir,   -8 * size, yPos);
        this.clyde.chaseDemo(dir, -10 * size, yPos);

        this.endPos = DemoData.chase.endTile * this.board.tileSize;
    }

    /**
     * Creates the Blob and the Ghosts
     * @returns {Void}
     */
    createPlayers() {
        this.blob   = new DemoBlob(this.board);
        this.blinky = new DemoGhost(this.board, Blinky.text, Blinky.color);
        this.pinky  = new DemoGhost(this.board, Pinky.text, Pinky.color);
        this.inky   = new DemoGhost(this.board, Inky.text, Inky.color);
        this.clyde  = new DemoGhost(this.board, Clyde.text, Clyde.color);

        this.ghosts = [ this.blinky, this.pinky, this.inky, this.clyde ];
    }

    /**
     * The Chase Animation
     * @param {Number} speed
     * @returns {Void}
     */
    chaseAnimation(speed) {
        this.animatePlayers(speed, true);

        if (this.blob.x >= this.endPos) {
            this.nextAnimation();
        }
    }



    /**
     * Initializes the Players for the Frighten animation
     * @returns {Void}
     */
    initFrighten() {
        const speed = this.level.getNumber("ghostFrightSpeed") * DemoData.frighten.speedMult;
        const dir   = DemoData.frighten.playersDir;

        this.blob.frightenDemo(dir);
        this.blinky.frightenDemo(dir, speed);
        this.pinky.frightenDemo(dir, speed);
        this.inky.frightenDemo(dir, speed);
        this.clyde.frightenDemo(dir, speed);

        this.scores = [];
        this.endPos = DemoData.frighten.endTile * this.board.tileSize;
    }

    /**
     * The Frighten Animation
     * @param {Number} time
     * @param {Number} speed
     * @returns {Void}
     */
    frightenAnimation(time, speed) {
        this.animatePlayers(speed);
        this.drawScores(time);

        if (this.ghosts.length > 0 && this.blob.x <= this.ghosts[0].x) {
            this.ghosts.shift();
            this.text = this.blob.x;
            this.scores.push({
                timer : 0,
                size  : 1,
                color : "rgb(51, 255, 255)",
                text  : this.level.getGhostScore(4 - this.ghosts.length),
                pos   : {
                    x : this.blob.x / this.board.tileSize,
                    y : DemoData.frighten.textTile,
                },
            });
        }
        if (this.blob.x < this.endPos) {
            this.nextAnimation();
        }
    }

    /**
     * Draws the Scores in the Canvas
     * @param {Number} time
     * @returns {Void}
     */
    drawScores(time) {
        this.scores.forEach((score, index) => {
            score.timer += time;
            score.size   = Math.min(0.2 + Math.round(score.timer * 100 / DemoData.chase.scoreInc) / 100, 1);

            if (score.timer < DemoData.chase.scoreTime) {
                this.canvas.drawText(score);
            } else {
                this.scores.splice(index, 1);
            }
        });
    }



    /**
     * Initializes the Players for the Present animation
     * @returns {Void}
     */
    initPresent() {
        this.blob = null;
        this.blinky.presentDemo(DemoData.present.dir);
        this.pinky.presentDemo(DemoData.present.dir);
        this.inky.presentDemo(DemoData.present.dir);
        this.clyde.presentDemo(DemoData.present.dir);

        this.ghosts   = [ this.blinky ];
        this.others   = [ this.pinky, this.inky, this.clyde ];
        this.count    = 4;
        this.presentX = DemoData.present.tile * this.board.tileSize;
        this.exitX    = this.board.width + this.board.tileSize;
    }

    /**
     * The Present Animation
     * @param {Number} time
     * @param {Number} speed
     * @returns {Void}
     */
    presentAnimation(time, speed) {
        if (this.timer <= 0) {
            this.animatePlayers(speed);

            if (this.count > 0 && this.ghosts[0].x > this.presentX) {
                this.drawName(this.ghosts[0]);
                if (this.others.length) {
                    this.ghosts.unshift(this.others[0]);
                    this.others.shift();
                }
                this.timer  = DemoData.present.timer;
                this.count -= 1;

            } else if (this.ghosts[this.ghosts.length - 1].x > this.exitX) {
                this.ghosts.pop();
                if (!this.ghosts.length) {
                    this.nextAnimation();
                }
            }

        } else {
            this.timer -= time;
        }
    }

    /**
     * Draws the Name of the given Ghost
     * @param {DemoGhost} ghost
     * @returns {Void}
     */
    drawName(ghost) {
        this.canvas.drawText({
            size  : 2,
            color : ghost.bodyColor,
            text  : `‘${ghost.name}’`,
            pos   : DemoData.present.namePos,
            align : null,
            alpha : null,
        });
    }



    /**
     * Animates all the players
     * @param {Number}   speed
     * @param {Boolean=} food
     * @returns {Void}
     */
    animatePlayers(speed, food) {
        this.canvas.clearSavedRects();

        if (food) {
            this.food.wink();
        }
        this.ghosts.forEach((ghost) => {
            ghost.demoAnimate(speed);
        });

        if (this.blob) {
            this.blob.animate(speed);
        }
    }
}

/**
 * Pacman Display
 */
class Display {

    /**
     * Pacman Display constructor
     * @param {Function} callback
     */
    constructor(callback) {
        this.container = document.querySelector("#container");
        this.current   = "mainScreen";
        this.callback  = callback;
    }

    /**
     * Sets the Game Display
     * @param {String} current
     * @returns {Display}
     */
    set(current) {
        this.current = current;
        return this;
    }



    /**
     * Adds the class to the design to show the Display
     * @returns {Void}
     */
    show() {
        this.container.className = this.current;
        this.callback();
    }

    /**
     * Returns true if the game is in the main screen
     * @returns {Boolean}
     */
    get isMainScreen() {
        return this.current === "mainScreen";
    }

    /**
     * Returns true if the game is in a playing mode
     * @returns {Boolean}
     */
    get isPlaying() {
        return [ "ready", "playing", "paused" ].includes(this.current);
    }

    /**
     * Returns true if the game is paused
     * @returns {Boolean}
     */
    get isPaused() {
        return this.current === "paused";
    }
}

/**
 * Pacman Fruit
 */
class Fruit {

    /**
     * Pacman Fruit constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board = board;
        this.level = board.level;
        this.ctx   = board.boardCanvas.ctx;
        this.timer = 0;
    }



    /**
     * Try to add a fruit in the board
     * @param {Number} dotsLeft
     * @returns {Void}
     */
    add(dotsLeft) {
        if (dotsLeft === this.level.fruitDots1 || dotsLeft === this.level.fruitDots2) {
            this.timer = this.level.fruitTime;
            this.draw(this.board.fruitTile);
        }
    }

    /**
     * Reduces the fruit timer when there is one
     * @param {Number} time
     * @returns {Void}
     */
    reduceTimer(time) {
        if (this.timer > 0) {
            this.timer -= time;
            if (this.timer <= 0) {
                this.eat();
            }
        }
    }

    /**
     * Eats the Fruit
     * @returns {Void}
     */
    eat() {
        this.clear();
        this.timer = 0;
    }

    /**
     * Returns true if the given tile is at the fruit position
     * @param {{x: Number, y: Number}} tile
     * @returns {Boolean}
     */
    isAtPos(tile) {
        if (this.timer <= 0) {
            return false;
        }
        const rect = this.board.fruitRect;
        const pos  = this.board.tileToPos(tile);
        return (
            pos.x >= rect.left && pos.x <= rect.right &&
            pos.y >= rect.top  && pos.y <= rect.bottom
        );
    }



    /**
     * Draws a Fruit
     * @param {{x: Number, y: Number}} tile
     * @returns {Void}
     */
    draw(tile) {
        const pos = this.board.tileToPos(tile);
        this.ctx.save();
        this.ctx.translate(pos.x, pos.y);
        this[`draw${this.level.fruitName}`]();
        this.ctx.restore();
    }

    /**
     * Clears the Fruit
     * @returns {Void}
     */
    clear() {
        const pos = this.board.fruitPos;
        this.ctx.clearRect(pos.x - 1, pos.y - 1, this.board.fruitSize, this.board.fruitSize);
    }



    /**
     * Draws the Cherries Fruit
     * @returns {Void}
     */
    drawCherries() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(255, 0, 0)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n10, nums.n14, nums.n4, 0, 2 * Math.PI);
        this.ctx.arc(nums.n4, nums.n10, nums.n4, 0, 2 * Math.PI);
        this.ctx.fill();

        this.ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n8, nums.n15, nums.r2, 0, 2 * Math.PI);
        this.ctx.arc(nums.r2, nums.n11, nums.r2, 0, 2 * Math.PI);
        this.ctx.fill();

        this.ctx.strokeStyle = "rgb(0, 153, 0)";
        this.ctx.lineWidth = nums.n2;
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n17, nums.n1);
        this.ctx.quadraticCurveTo(nums.n9, nums.n1, nums.n5, nums.n9);
        this.ctx.moveTo(nums.n17, nums.n1);
        this.ctx.quadraticCurveTo(nums.n12, nums.n3, nums.n10, nums.n12);
        this.ctx.stroke();

        this.ctx.strokeStyle = "rgb(222, 151, 81)";
        this.ctx.lineWidth = nums.n3;
        this.ctx.lineCap = "round";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n17, nums.n1);
        this.ctx.lineTo(nums.n16, nums.n2);
        this.ctx.stroke();
    }

    /**
     * Draws the Strawberry Fruit
     * @returns {Void}
     */
    drawStrawberry() {
        const nums = this.board.numbers;
        const dots = [
            nums.n3, nums.n7, nums.n5, nums.n6, nums.n4, nums.n10, nums.n7,
            nums.n8, nums.n6, nums.n11, nums.n7, nums.n13, nums.n9, nums.n10,
            nums.n9, nums.n14, nums.n10, nums.n12, nums.n11, nums.n8, nums.n12,
            nums.n11, nums.n14, nums.n6, nums.n14, nums.n9,
        ];

        this.ctx.fillStyle = "rgb(222, 0, 0)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n9, nums.n3);
        this.ctx.quadraticCurveTo(nums.n17, nums.n3, nums.n17, nums.n7);
        this.ctx.quadraticCurveTo(nums.n17, nums.n14, nums.n9, nums.n17);
        this.ctx.quadraticCurveTo(nums.n1, nums.n14, nums.n1, nums.n7);
        this.ctx.quadraticCurveTo(nums.n1, nums.n3, nums.n9, nums.n3);
        this.ctx.fill();

        this.ctx.fillStyle = "rgb(0, 222, 0)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n5, nums.n3);
        this.ctx.lineTo(nums.n13, nums.n3);
        this.ctx.lineTo(nums.n14, nums.n4);
        this.ctx.lineTo(nums.n9, nums.n7);
        this.ctx.lineTo(nums.n4, nums.n4);
        this.ctx.fill();

        this.ctx.fillStyle = "rgb(255, 255, 255)";
        this.ctx.fillRect(nums.n8, 0, nums.n2, nums.n4);

        for (let i = 0; i < dots.length; i += 2) {
            this.ctx.fillRect(dots[i], dots[i + 1], 1, 1);
        }
    }

    /**
     * Draws the Peach Fruit
     * @returns {Void}
     */
    drawPeach() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(255, 181, 33)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n6,  nums.n10, nums.n5, Math.PI, 1.5 * Math.PI, false);
        this.ctx.arc(nums.n12, nums.n10, nums.n5, 1.5 * Math.PI, 2 * Math.PI, false);
        this.ctx.arc(nums.n10, nums.n11, nums.n7, 0, 0.5 * Math.PI, false);
        this.ctx.arc(nums.n8,  nums.n11, nums.n7, 0.5 * Math.PI, Math.PI, false);
        this.ctx.fill();

        this.ctx.strokeStyle = "rgb(0, 222, 0)";
        this.ctx.lineCap = "round";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n6, nums.n5);
        this.ctx.lineTo(nums.n14, nums.n4);
        this.ctx.moveTo(nums.n14, 0);
        this.ctx.quadraticCurveTo(nums.n11, 0, nums.n10, nums.n7);
        this.ctx.stroke();
    }

    /**
     * Draws the Apple Fruit
     * @returns {Void}
     */
    drawApple() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(222, 0, 0)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n6,  nums.n8,  nums.n5, Math.PI, 1.5 * Math.PI, false);
        this.ctx.arc(nums.n12, nums.n8,  nums.n5, 1.5 * Math.PI, 2 * Math.PI, false);
        this.ctx.arc(nums.n10, nums.n11, nums.n7, 0, 0.5 * Math.PI, false);
        this.ctx.arc(nums.n13, nums.n15, nums.n3, 0.5 * Math.PI, Math.PI, false);
        this.ctx.arc(nums.n6,  nums.n15, nums.n3, 0, 0.5 * Math.PI, false);
        this.ctx.arc(nums.n8,  nums.n11, nums.n7, 0.5 * Math.PI, Math.PI, false);
        this.ctx.fill();

        this.ctx.strokeStyle = "rgb(0, 222, 0)";
        this.ctx.lineCap = "round";
        this.ctx.beginPath();
        this.ctx.arc(nums.n3,  nums.n7, nums.n7, 1.5 * Math.PI, 2 * Math.PI, false);
        this.ctx.arc(nums.n13, nums.n4, nums.n4, Math.PI, 1.5 * Math.PI, false);
        this.ctx.stroke();

        this.ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n7, nums.n9, nums.n4, Math.PI, 1.5 * Math.PI, false);
        this.ctx.stroke();
    }

    /**
     * Draws the Grapes Fruit
     * @returns {Void}
     */
    drawGrapes() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(0, 222, 0)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n9, nums.n10, nums.n8, 0, 2 * Math.PI);
        this.ctx.fill();

        this.ctx.strokeStyle = "rgb(74, 74, 0)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n9, nums.n3);
        this.ctx.lineTo(nums.n2, nums.n10);
        this.ctx.lineTo(nums.n7, nums.n15);
        this.ctx.moveTo(nums.n14, nums.n5);
        this.ctx.lineTo(nums.n8, nums.n11);
        this.ctx.lineTo(nums.n14, nums.n17);
        this.ctx.moveTo(nums.n9, nums.n5);
        this.ctx.lineTo(nums.n15, nums.n11);
        this.ctx.lineTo(nums.n10, nums.n16);
        this.ctx.moveTo(nums.n10, nums.n13);
        this.ctx.lineTo(nums.n4, nums.n17);
        this.ctx.stroke();

        this.ctx.strokeStyle = "rgb(222, 148, 74)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n4, 0);
        this.ctx.lineTo(nums.n5, nums.n1);
        this.ctx.lineTo(nums.n12, nums.n1);
        this.ctx.moveTo(nums.n9, nums.n1);
        this.ctx.lineTo(nums.n9, nums.n4);
        this.ctx.stroke();
    }

    /**
     * Draws the Galaxian Fruit
     * @returns {Void}
     */
    drawGalaxian() {
        const nums = this.board.numbers;

        this.ctx.fillStyle   = "rgb(255, 250, 55)";
        this.ctx.strokeStyle = "rgb(255, 250, 55)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n1, nums.n4);
        this.ctx.lineTo(nums.n17, nums.n4);
        this.ctx.lineTo(nums.n9, nums.n11);
        this.ctx.fill();
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n9, nums.n11);
        this.ctx.lineTo(nums.n9, nums.n18);
        this.ctx.stroke();

        this.ctx.strokeStyle = "rgb(0, 51, 255)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n1, nums.n1);
        this.ctx.lineTo(nums.n1, nums.n6);
        this.ctx.lineTo(nums.n8, nums.n12);
        this.ctx.moveTo(nums.n17, nums.n1);
        this.ctx.lineTo(nums.n17, nums.n6);
        this.ctx.lineTo(nums.n10, nums.n12);
        this.ctx.stroke();

        this.ctx.fillStyle   = "rgb(255, 0, 0)";
        this.ctx.strokeStyle = "rgb(255, 0, 0)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n3, nums.n5);
        this.ctx.lineTo(nums.n9, 0);
        this.ctx.lineTo(nums.n15, nums.n5);
        this.ctx.fill();
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n9, nums.n3);
        this.ctx.lineTo(nums.n9, nums.n6);
        this.ctx.stroke();
    }

    /**
     * Draws the Bell Fruit
     * @returns {Void}
     */
    drawBell() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(255, 255, 33)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n1, nums.n15);
        this.ctx.quadraticCurveTo(nums.n1, nums.n1, nums.n9, nums.n1);
        this.ctx.quadraticCurveTo(nums.n17, nums.n1, nums.n17, nums.n15);
        this.ctx.fill();

        this.ctx.fillStyle = "rgb(0, 222, 222)";
        this.ctx.fillRect(nums.n3, nums.n14, nums.n12, nums.n3);
        this.ctx.fillStyle = "rgb(255, 255, 255)";
        this.ctx.fillRect(nums.n9, nums.n14, nums.n3, nums.n3);

        this.ctx.strokeStyle = "rgb(255, 255, 255)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n8, nums.n4);
        this.ctx.quadraticCurveTo(nums.n4, nums.n4, nums.n4, nums.n13);
        this.ctx.stroke();
    }

    /**
     * Draws the Key Fruit
     * @returns {Void}
     */
    drawKey() {
        const nums = this.board.numbers;

        this.ctx.fillStyle = "rgb(0, 222, 222)";
        this.ctx.beginPath();
        this.ctx.arc(nums.n6,  nums.n3, nums.n3, Math.PI, 1.5 * Math.PI, false);
        this.ctx.arc(nums.n12, nums.n3, nums.n3, 1.5 * Math.PI, 2 * Math.PI, false);
        this.ctx.arc(nums.n12, nums.n5, nums.n3, 0, 0.5 * Math.PI, false);
        this.ctx.arc(nums.n6,  nums.n5, nums.n3, 0.5 * Math.PI, Math.PI, false);
        this.ctx.fill();
        this.ctx.clearRect(nums.n6, nums.n2, nums.n6, nums.n2);

        this.ctx.strokeStyle = "rgb(255, 255, 255)";
        this.ctx.beginPath();
        this.ctx.moveTo(nums.n8, nums.n8);
        this.ctx.lineTo(nums.n8, nums.n15);
        this.ctx.arc(nums.n8 + nums.r2, nums.n15 - nums.r2, nums.r2, Math.PI, 0, true);
        this.ctx.lineTo(nums.n11, nums.n8);
        this.ctx.moveTo(nums.n11, nums.n10);
        this.ctx.lineTo(nums.n14, nums.n10);
        this.ctx.moveTo(nums.n11, nums.n13);
        this.ctx.lineTo(nums.n14, nums.n13);
        this.ctx.stroke();
    }
}

/**
 * Pacman Ghosts
 */
class Ghosts {

    /**
     * Pacman Ghosts constructor
     * @param {Board}   board
     * @param {?Ghosts} oldManager
     */
    constructor(board, oldManager) {
        this.level = board.level;

        // Ghosts Data
        this.globalMode  = "scatter";                   // Global Mode
        this.modeCounter = 0;                           // Amount of switchs between Scatter-Chase
        this.modeTimer   = this.level.getSwitchTime(0); // Scatter/Chase timer
        this.frightTimer = 0;                           // Frigthen timer
        this.blinksCount = 0;                           // Amount of blinks at frighten end
        this.eyesCounter = 0;                           // Amount of dead Ghost during a fright mode

        // The Ghosts
        const canvas     = board.gameCanvas;
        // @ts-ignore
        const blinkyDots = oldManager && oldManager.blinky ? oldManager.blinky.dotsCount : null;
        // @ts-ignore
        const pinkyDots  = oldManager && oldManager.pinky  ? oldManager.pinky.dotsCount  : null;
        // @ts-ignore
        const inkyDots   = oldManager && oldManager.inky   ? oldManager.inky.dotsCount   : null;
        // @ts-ignore
        const clydeDots  = oldManager && oldManager.clyde  ? oldManager.clyde.dotsCount  : null;

        this.blinky      = new Blinky(board, canvas, blinkyDots);
        this.pinky       = new Pinky(board, canvas, pinkyDots);
        this.inky        = new Inky(board, canvas, inkyDots, this.blinky);
        this.clyde       = new Clyde(board, canvas, clydeDots);
        this.ghosts      = [ this.blinky, this.pinky, this.inky, this.clyde ];

        // Pen Data
        this.penType     = !!oldManager;               // Type used to force ghosts out of the pen (false = using
                                                       // ... ghost's dot counters | true = using global dot counter)
        this.penTimer    = 0;                          // Pen Leaving Force Timer
        this.globalDots  = 0;                          // Global dots counter

        /** @type {(Blinky|Pinky|Inky|Clyde)[]} */
        this.inPen       = [ this.pinky, this.inky, this.clyde ];

        if (!this.penType) {
            this.inPen.forEach(() => this.checkDotLimit());
        }
    }



    /**
     * Animates all the Ghosts, and reduces the ghosts modes timers
     * @param {Number} time
     * @param {Number} speed
     * @param {Blob}   blob
     * @returns {Void}
     */
    animate(time, speed, blob) {
        if (this.frightTimer > 0) {
            this.frightTimer -= time;
        } else if (this.modeCounter < this.level.totalSwitches && this.modeTimer > 0) {
            this.modeTimer -= time;
        }

        this.switchMode(blob);
        this.move(speed, blob);
        this.increasePenTimer(time);
    }

    /**
     * Changes the Ghosts mode
     * @param {Blob} blob
     * @returns {Void}
     */
    switchMode(blob) {
        const oldMode = this.globalMode;
        if (this.level.isFrighten(this.globalMode) && this.frightTimer <= 0) {
            this.blinksCount -= 1;

            if (this.blinksCount >= 0) {
                this.frightTimer = this.level.blinksTimer;
                this.globalMode  = this.globalMode === "white" ? "blue" : "white";
            } else {
                this.globalMode  = this.getSwitchMode();
            }
            this.switchGhostsMode(oldMode, blob);

        } else if (this.modeTimer <= 0) {
            this.modeCounter += 1;
            this.globalMode   = this.getSwitchMode();
            this.modeTimer    = this.level.getSwitchTime(this.modeCounter);
            this.switchGhostsMode(oldMode, blob);
        }
    }

    /**
     * Changes the mode of each Ghost
     * @param {String} oldMode
     * @param {Blob}   blob
     * @returns {Void}
     */
    switchGhostsMode(oldMode, blob) {
        this.ghosts.forEach((ghost) => {
            ghost.switchMode(oldMode, this.globalMode, blob);
        });
    }

    /**
     * Moves all the Ghosts
     * @param {Number} speed
     * @param {Blob}   blob
     * @returns {Void}
     */
    move(speed, blob) {
        const mode = this.getSwitchMode();
        this.ghosts.forEach((ghost) => {
            if (ghost.move(speed, blob, mode)) {
                this.addGhostToPen(ghost);
            }
        });
    }

    /**
     * Draws all The Ghosts
     * @returns {Void}
     */
    draw() {
        this.ghosts.forEach((ghost) => ghost.draw());
    }

    /**
     * Sets the Ghosts targets when the Blob reached a new Tile
     * @param {Blob} blob
     * @returns {Void}
     */
    setTargets(blob) {
        this.ghosts.forEach((ghost) => {
            if (ghost.shouldChangeTarget(this.globalMode)) {
                ghost.setChaseTarget(blob);
            }
        });
    }

    /**
     * Sets Blinky's "Cruise Elroy" Mode when the number of dots left reaches the target
     * @param {Number} dots
     * @returns {Void}
     */
    checkElroyDots(dots) {
        this.blinky.checkElroyDots(dots);
    }

    /**
     * Switches to Frighten mode
     * @param {Blob} blob
     * @returns {Void}
     */
    frighten(blob) {
        const oldMode    = this.globalMode;
        this.globalMode  = "blue";
        this.frightTimer = this.level.frightTime;
        this.blinksCount = this.level.blinks;
        this.eyesCounter = 0;

        this.switchGhostsMode(oldMode, blob);
    }

    /**
     * The Ghost kills the Blob or Dies from it. Returns true if the Blob died
     * @param {{x: Number, y: Number}} blobTile
     * @param {Function}               onKill
     * @param {Function}               onDie
     * @returns {Void}
     */
    crash(blobTile, onKill, onDie) {
        this.ghosts.some((ghost) => {
            const result = ghost.killOrDie(blobTile);
            if (result === "kill") {
                this.eyesCounter += 1;
                onKill(this.eyesCounter, ghost.tile);
            } else if (result === "die") {
                onDie();
            }
            return !!result;
        });
    }

    /**
     * Returns the current Scatter or Chase mode
     * @returns {String}
     */
    getSwitchMode() {
        return this.modeCounter % 2 === 0 ? "scatter" : "chase";
    }

    /**
     * Returns the current Mode, including the Fright variations
     * @returns {String}
     */
    getMode() {
        return this.globalMode;
    }

    /**
     * Returns true if the current mode is a Fright
     * @returns {Boolean}
     */
    areFrighten() {
        return this.level.isFrighten(this.globalMode);
    }



    /**
     * Increases the global dots or the first Ghost internal dots depending on the mode
     * @returns {Void}
     */
    incDotCounter() {
        if (!this.penType) {
            this.incGhostsDots();
        } else {
            this.incGlobalDots();
        }
    }

    /**
     * Increases the internal dots counter for the Ghost in the Pen array
     * @returns {Void}
     */
    incGhostsDots() {
        if (this.inPen.length > 0) {
            this.inPen[0].increaseDots();
            this.checkDotLimit();
        }
    }

    /**
     * Checks if a ghost can leave pen
     * @returns {Void}
     */
    checkDotLimit() {
        const limits = this.level.getData("penLeavingLimit");
        const ghost  = this.inPen[0];

        if (limits[ghost.id] <= ghost.dotsCount) {
            this.releaseGhostFromPen();
        }
    }

    /**
     * Increases the global dot counter and release ghosts changes type when required
     * @returns {Void}
     */
    incGlobalDots() {
        this.globalDots += 1;

        this.inPen.forEach((ghost) => {
            if (this.globalDots === this.level.getPenDotsCount(ghost.id)) {
                if (ghost.id <= 2) {
                    this.releaseGhostFromPen();
                } else {
                    this.penType    = false;
                    this.globalDots = 0;
                }
            }
        });
    }

    /**
     * Increases the Pen Timer
     * @param {Number} time
     * @returns {Void}
     */
    increasePenTimer(time) {
        this.penTimer += time;
        if (this.inPen.length > 0 && this.penTimer >= this.level.penForceTime) {
            this.releaseGhostFromPen();
            this.penTimer = 0;
        }
    }

    /**
     * Resents the Pen Timer to cero, since the Blob ate a pill and checks the Dots counters
     * @returns {Void}
     */
    resetPenTimer() {
        this.penTimer = 0;
        this.incDotCounter();
    }

    /**
     * Releases the first Ghost in the vector from Pen
     * @returns {Void}
     */
    releaseGhostFromPen() {
        const ghost = this.inPen[0];
        ghost.setPath("exitPen");
        ghost.activateElroy();

        this.inPen = this.inPen.slice(1);
    }

    /**
     * Adds the given Ghost to Pen
     * @param {(Blinky|Pinky|Inky|Clyde)} ghost
     * @returns {Void}
     */
    addGhostToPen(ghost) {
        // Blinky never stays in the Pen
        if (ghost.id === 0) {
            ghost.setPath("exitPen");
        } else {
            let i = 0;
            while (i < this.inPen.length && this.inPen[i].id <= ghost.id) {
                i += 1;
            }
            this.inPen.splice(i, 0, ghost);
            ghost.setPath("inPen");

            if (!this.penType) {
                this.checkDotLimit();
            }
        }
    }
}

class Storage {
    constructor(namespace) { this.namespace = namespace; }
    key(key) { return `${this.namespace}.${key}`; }
    get(key) {
        try { const v = localStorage.getItem(this.key(key)); return v === null ? null : JSON.parse(v); }
        catch { return null; }
    }
    set(key, value) { try { localStorage.setItem(this.key(key), JSON.stringify(value)); } catch {} }
    remove(key) { try { localStorage.removeItem(this.key(key)); } catch {} }
}

/**
 * Pacman High Scores
 */
class HighScores {

    /**
     * Pacman High Scores constructor
     */
    constructor() {
        this.data      = new Storage("pacman.hs");
        this.total     = this.data.get("total") || 0;
        this.isFocused = false;
        this.maxScores = 10;

        /** @type {HTMLInputElement} */
        this.input     = document.querySelector(".input input");

        /** @type {HTMLElement} */
        this.scores    = document.querySelector(".scores");

        /** @type {HTMLElement} */
        this.none      = document.querySelector(".none");

        this.input.onfocus = () => this.isFocused = true;
        this.input.onblur  = () => this.isFocused = false;
    }

    /**
     * Show the Scores for the given mode
     * @returns {Void}
     */
    show() {
        this.scores.innerHTML = "";
        this.showHideNone(this.total === 0);

        if (this.total > 0) {
            this.displayTitles();
            this.displayScores();
        }
    }

    /**
     * Create the titles and place it in the DOM
     * @returns {Void}
     */
    displayTitles() {
        const div = this.createContent("name", "lvl", "score");
        div.className = "titles";
        this.scores.appendChild(div);
    }

    /**
     * Create each score line and place it in the DOM
     * @returns {Void}
     */
    displayScores() {
        for (let i = 1; i <= this.total; i += 1) {
            const data = this.data.get(i);
            const div  = this.createContent(data.name, data.level, Utils.formatNumber(data.score, ","));

            div.className = "highScore";
            this.scores.appendChild(div);
        }
    }

    /**
     * Creates the content for each High Score
     * @returns {HTMLElement}
     */
    createContent(name, level, score) {
        const element = document.createElement("DIV");
        element.innerHTML = `
            <div class="left">${name}</div>
            <div class="middle">${level}</div>
            <div class="right">${score}</div>
        `;
        return element;
    }

    /**
     * Tries to save a score, when possible
     * @param {Number} level
     * @param {Number} score
     * @returns {Boolean}
     */
    save(level, score) {
        if (this.input.value) {
            this.saveData(level, score);
            return true;
        }
        return false;
    }

    /**
     * Gets the scores and adds the new one in the right position, updating the total, when possible
     * @param {Number} level
     * @param {Number} score
     * @returns {Void}
     */
    saveData(level, score) {
        const data   = [];
        const actual = {
            name  : this.input.value,
            level : level,
            score : score
        };
        let saved = false;

        for (let i = 1; i <= this.total; i += 1) {
            const hs = this.data.get(i);
            if (!saved && hs.score < actual.score) {
                data.push(actual);
                saved = true;
            }
            if (data.length < this.maxScores) {
                data.push(hs);
            }
        }
        if (!saved && data.length < this.maxScores) {
            data.push(actual);
        }

        this.data.set("total", data.length);
        data.forEach((element, index) => {
            this.data.set(index + 1, element);
        });
        this.total = data.length;
    }

    /**
     * Deletes all the Scores
     * @returns {Void}
     */
    restore() {
        for (let i = 1; i <= this.total; i += 1) {
            this.data.remove(i);
        }
        this.data.set("total", 0);
        this.show();
    }

    /**
     * Shows or hides the no results element
     * @param {Boolean} show
     * @returns {Void}
     */
    showHideNone(show) {
        this.none.style.display = show ? "block" : "none";
    }

    /**
     * Sets the input value and focus it
     * @returns {Void}
     */
    setInput() {
        this.input.value = "";
        this.input.focus();
    }
}

/**
 * Pacman Score Blob
 * @extends {Blob}
 */
class ScoreBlob extends Blob {

    /**
     * Pacman Score Blob constructor
     * @param {Board}  board
     * @param {Number} number
     */
    constructor(board, number) {
        super(board);
        this.init(board.boardCanvas);

        this.tile = { x: 19.5, y: 31.8 },
        this.x    = board.getTileCenter(this.tile.x + number * 1.4);
        this.y    = board.getTileCenter(this.tile.y);
        this.dir  = board.startingDir;
    }

    /**
     * Clears the Blob
     * @returns {Void}
     */
    clear() {
        this.ctx.clearRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
    }
}

/**
 * Pacman Score
 */
class Score {

    /**
     * Pacman Score constructor
     * @param {Board} board
     */
    constructor(board) {
        this.board  = board;
        this.level  = board.level;
        this.canvas = board.boardCanvas;
        this.ctx    = this.canvas.ctx;

        this.score  = 0;
        this.lives  = 2;
        this.bonus  = 0;
        this.ghosts = 0;

        this.textTop     = 32.25;
        this.scoreLeft   = 3.2;
        this.livesLeft   = 16.3;
        this.scoreMargin = 0.5;
        this.scoreWidth  = 7;
        this.scoreHeight = 2;
        this.scoreColor  = "rgb(255, 255, 51)";
        this.fruitTile   = { x: 26, y: 31.5 };

        this.blobs = [ new ScoreBlob(this.board, 0), new ScoreBlob(this.board, 1) ];
        this.food  = new Fruit(this.board);
    }

    /**
     * Draws the Score, Blobs and Fruit in the board
     * @returns {Void}
     */
    draw() {
        this.drawTexts();
        this.drawScore();

        this.blobs.forEach((blob) => blob.draw());
        this.food.draw(this.fruitTile);
    }



    /**
     * Increases the game score by the given amount
     * @param {Number} amount
     * @returns {Void}
     */
    incScore(amount) {
        this.score += amount;
        if (this.score > this.level.extraLife * Math.pow(10, this.bonus)) {
            if (this.lives < 4) {
                this.incLife(true);
            }
            this.bonus += 1;
        }
        this.drawScore();
    }

    /**
     * Increases/Decreases the game lives depending on the param
     * @param {Boolean} isIncrease
     * @returns {Void}
     */
    incLife(isIncrease) {
        this.lives += isIncrease ? 1 : -1;

        if (isIncrease) {
            const blob = new ScoreBlob(this.board, this.lives - 1);
            this.blobs.push(blob);
            blob.draw();
        } else if (this.blobs.length) {
            const blob = this.blobs.pop();
            blob.clear();
        }
    }



    /**
     * Increases the game level
     * @returns {Void}
     */
    newLevel() {
        this.ghosts = 0;
        this.level.inc();
    }

    /**
     * The Blob ate a pill/energizer
     * @param {Number} value
     * @returns {Void}
     */
    pill(value) {
        this.incScore(value * this.level.pillMult);
    }

    /**
     * The Blob ate a fruit
     * @returns {Number}
     */
    fruit() {
        const score = this.level.getNumber("fruitScore");
        this.incScore(score);
        return score;
    }

    /**
     * The Blob kill a Ghost
     * @param {Number} amount
     * @returns {Number}
     */
    kill(amount) {
        const score = this.level.getGhostScore(amount);
        this.incScore(score);

        if (amount === 4) {
            this.ghosts += 1;
            if (this.ghosts === 4) {
                this.incScore(this.level.eyesBonus);
            }
        }
        return score;
    }

    /**
     * The Blob died, decrease the lifes
     * @returns {Boolean}
     */
    died() {
        this.incLife(false);
        return this.lives >= 0;
    }



    /**
     * Draws the texts in the board
     * @returns {Void}
     */
    drawTexts() {
        this.canvas.drawText({
            text  : "Score",
            size  : 1.8,
            pos   : { x: this.scoreLeft, y: this.textTop },
            color : null,
            align : null,
            alpha : null,
        });
        this.canvas.drawText({
            text  : "Lives",
            size  : 1.8,
            pos   : { x: this.livesLeft, y: this.textTop },
            color : null,
            align : null,
            alpha : null,
        });
    }

    /**
     * Draws the score in the board
     * @returns {Void}
     */
    drawScore() {
        const left   = this.ctx.measureText("Score").width;
        const margin = this.scoreMargin * this.board.tileSize;
        const top    = this.textTop     * this.board.tileSize;
        const width  = this.scoreWidth  * this.board.tileSize + margin / 2;
        const height = this.scoreHeight * this.board.tileSize;

        this.ctx.save();
        this.ctx.fillStyle = this.scoreColor;
        this.ctx.textAlign = "left";
        this.ctx.font      = `1.8em "Whimsy TT"`;
        this.ctx.clearRect(left + margin / 2, top - height / 2 - 2, width, height + 2);
        this.ctx.fillText(String(this.score), left + margin, top);
        this.ctx.restore();
    }
}

// ===== utils/KeyCode.js =====
const names = {
    13: 'Enter', 32: 'Space', 37: 'Left', 38: 'Up', 39: 'Right', 40: 'Down',
    65: 'A', 66: 'B', 67: 'C', 68: 'D', 72: 'H', 77: 'M', 78: 'N', 80: 'P', 82: 'R', 83: 'S', 87: 'W'
};
class KeyCode {
    static keyToCode(code, named = false) { return named ? (names[code] || '') : code; }
}

// ===== utils/Sounds.js =====
const files = { start: 'start.mp3', eat1: 'eat1.mp3', eat2: 'eat2.mp3', kill: 'kill.mp3', death: 'death.mp3' };
class Sounds {
    constructor(id) {
        this.id = id; this.enabled = true; this.audio = {};
        for (const [name, file] of Object.entries(files)) {
            const a = new Audio(`audio/${file}`); a.preload = 'auto'; this.audio[name] = a;
        }
    }
    play(name) {
        if (!this.enabled || !this.audio[name]) return;
        const a = this.audio[name].cloneNode(); a.volume = .65;
        a.play().catch(() => {});
    }
    toggle() { this.enabled = !this.enabled; return this.enabled; }
}

// Utils




// Variables
let board      = null;
let display    = null;
let demo       = null;
let animations = null;
let sounds     = null;
let scores     = null;
let score      = null;
let food       = null;
let fruit      = null;
let ghosts     = null;
let blob       = null;
let animation  = null;
let startTime  = null;
let actions    = null;
let shortcuts  = null;;



/**
 * Calls the Game Over animation and then deletes the game data
 * @returns {Void}
 */
function gameOver() {
    display.set("ready");
    animations.gameOver(() => {
        food   = null;
        fruit  = null;
        ghosts = null;
        blob   = null;

        board.clearAll();
        display.set("gameOver").show();
        scores.setInput();
    });
}

/**
 * Creates the Blob and the Ghosts, and starts the Ready animation
 * @param {Boolean} newLife
 * @returns {Void}
 */
function createPlayers(newLife) {
    ghosts = new Ghosts(board, newLife ? ghosts : null);
    blob   = new Blob(board);

    blob.draw();
    ghosts.draw();
    animations.ready(() => display.set("playing"));
}



/**
 * Called when the Blob enters a new tile
 * @returns {Void}
 */
function blobEating() {
    const tile   = blob.tile;
    const atPill = food.isAtPill(tile);

    if (atPill) {
        const value = food.eatPill(tile);
        const total = food.getLeftPills();

        fruit.add(total);
        score.pill(value);
        ghosts.resetPenTimer();
        ghosts.checkElroyDots(total);

        if (value === board.level.energizerValue) {
            ghosts.frighten(blob);
        }
        sounds.play(blob.getSound());

    } else if (fruit.isAtPos(tile)) {
        const text = score.fruit();
        fruit.eat();
        animations.fruitScore(text, board.fruitTile);
    }
    blob.onEat(atPill, ghosts.areFrighten());
}

/**
 * Called to do the crash etween a ghost and th blob
 * @returns {Void}
 */
function ghostCrash() {
    ghosts.crash(blob.tile, (eyesCounter, tile) => {
        const text = score.kill(eyesCounter);
        animations.ghostScore(text, tile);
        sounds.play("kill");
    }, () => {
        board.clearGame();
        animations.death(blob, newLife);
        sounds.play("death");
    });
}



/**
 * Called after the Blob dies
 * @returns {Void}
 */
function newLife() {
    const hasLives = score.died();
    if (hasLives) {
        display.set("ready");
        createPlayers(true);
    } else {
        gameOver();
    }
}

/**
 * Called after we get to a new level
 * @returns {Void}
 */
function newLevel() {
    animations.newLevel(board.level.get(), () => {
        food  = new Food(board);
        fruit = new Fruit(board);

        board.clearGame();
        food.draw();
        score.draw();
        createPlayers(false);
    });
}



/**
 * Request an animation frame
 * @returns {Void}
 */
function requestAnimation() {
    startTime = new Date().getTime();
    animation = window.requestAnimationFrame(() => {
        const time  = new Date().getTime() - startTime;
        const speed = (time / 16) * 1.5;

        if (speed > 5) {
            return requestAnimation();
        }

        if (display.isMainScreen) {
            demo.animate(time, speed);
        } else if (animations.isAnimating) {
            animations.animate(time);
        } else if (display.isPlaying) {
            board.clearGame();
            food.wink();
            fruit.reduceTimer(time);
            ghosts.animate(time, speed, blob);
            const newTile = blob.animate(speed);
            animations.animate(time);

            if (newTile) {
                ghosts.setTargets(blob);
                blobEating();
            }
            if (food.getLeftPills() === 0) {
                score.newLevel();
                animations.endLevel(newLevel);
            }
            ghostCrash();
        }
        requestAnimation();
    });
}

/**
 * Cancel an animation frame
 * @returns {Void}
 */
function cancelAnimation() {
    window.cancelAnimationFrame(animation);
}



/**
 * Starts a new Game
 * @returns {Void}
 */
function newGame() {
    display.set("ready").show();
    cancelAnimation();

    score = new Score(board);
    food  = new Food(board);
    fruit = new Fruit(board);

    demo.destroy();
    board.start();
    food.draw();
    score.draw();

    createPlayers(false);
    requestAnimation();
    sounds.play("start");
}

/**
 * Toggles the Game Pause
 * @returns {Void}
 */
function togglePause() {
    if (display.isPaused) {
        display.set("playing");
        animations.endAll();
    } else {
        display.set("paused");
        animations.paused();
    }
}

/**
 * Show the High Scores
 * @returns {Void}
 */
function showHighScores() {
    display.set("highScores").show();
    scores.show();
}

/**
 * Saves the High Score
 * @returns {Void}
 */
function saveHighScore() {
    if (scores.save(score.level, score.score)) {
        showHighScores();
    }
}



/**
 * Creates a shortcut object
 * @returns {Void}
 */
function createActionsShortcuts() {
    actions = {
        play       : () => newGame(),
        pause      : () => togglePause(),
        highScores : () => showHighScores(),
        help       : () => display.set("help").show(),
        sound      : () => sounds.toggle(),
        save       : () => saveHighScore(),
        retore     : () => scores.restore(),
        mainScreen : () => display.set("mainScreen").show(),
    };

    shortcuts = {
        mainScreen : {
            Enter : "play",
            Space : "play",
            Down  : "play",
            H     : "highScores",
            C     : "help",
            M     : "sound",
        },
        playing : {
            P     : "pause",
            Space : "pause",
            M     : () => sounds.toggle(),
            Left  : () => blob.makeTurn({ x: -1, y:  0 }),
            Up    : () => blob.makeTurn({ x:  0, y: -1 }),
            Right : () => blob.makeTurn({ x:  1, y:  0 }),
            Down  : () => blob.makeTurn({ x:  0, y:  1 }),
        },
        paused : {
            P     : "pause",
            Space : "pause",
        },
        gameOver : {
            Enter : () => saveHighScore(),
            B     : () => display.set("mainScreen").show(),
        },
        highScores : {
            B     : () => display.set("mainScreen").show(),
            R     : () => scores.restore()
        },
        help : {
            B     : () => display.set("mainScreen").show(),
        }
    };
}

/**
 * Stores the used DOM elements and initializes the Event Handlers
 * @returns {Void}
 */
function initMobileListeners() {
    document.addEventListener("pacman-touch", (e) => {
        if (!blob || !display.isPlaying) return;
        const direction = e.detail;
        const turns = {
            Left: { x: -1, y: 0 },
            Up: { x: 0, y: -1 },
            Right: { x: 1, y: 0 },
            Down: { x: 0, y: 1 },
        };
        if (turns[direction]) blob.makeTurn(turns[direction]);
    });
    document.addEventListener("pacman-pause", () => {
        if (display.isPlaying || display.isPaused) togglePause();
    });
}

function initDomListeners() {
    document.body.addEventListener("click", (e) => {
        const element = Utils.getTarget(e);
        if (actions[element.dataset.action]) {
            actions[element.dataset.action](element.dataset.data || undefined);
            e.preventDefault();
        }
    });

    document.addEventListener("keydown", (e) => {
        const code = KeyCode.keyToCode(e.keyCode, true);
        if (shortcuts[display.current] && shortcuts[display.current][code]) {
            if (typeof shortcuts[display.current][code] === "string") {
                actions[shortcuts[display.current][code]]();
            } else {
                shortcuts[display.current][code]();
            }
            e.preventDefault();
        }
    });
}

/**
 * Destroys the demo when the display changes
 * @returns {Void}
 */
function onShow() {
    if (!display.isMainScreen) {
        demo.destroy();
    }
}

/**
 * The main Function
 * @returns {Void}
 */
function main() {
    board      = new Board();
    display    = new Display(onShow);
    demo       = new Demo(board);
    animations = new Animations(board);
    sounds     = new Sounds("pacman.sound");
    scores     = new HighScores();

    createActionsShortcuts();
    initDomListeners();
    initMobileListeners();
    requestAnimation();
}

// Load the game
window.addEventListener("load", main, false);

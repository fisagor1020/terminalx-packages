<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Brick Breaker - Touch & Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
    .chip { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; backdrop-filter: blur(6px); }
    .btn-sm { background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; }
    .hint { text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="top-bar">
        <div class="chip" style="color:#38bdf8;">SCORE: <span id="scoreText">0</span></div>
        <div class="chip" style="color:#f43f5e;">❤️ <span id="livesText">3</span></div>
        <button class="btn-sm" id="soundBtn">🔊 Sound</button>
        <button class="btn-sm" id="fsBtn">⛶ Full</button>
      </div>
      <div class="hint">Drag finger or mouse to steer paddle • Tap to Launch</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');

    const W = 400;
    const H = 640;
    canvas.width = W;
    canvas.height = H;

    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playBeep(freq, type='sine', dur=0.08) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });
    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    const paddle = {
      x: W / 2 - 45,
      y: H - 50,
      w: 90,
      h: 12,
      speed: 8
    };

    let balls = [{
      x: W / 2,
      y: H - 70,
      vx: 4,
      vy: -5,
      radius: 6,
      stuck: true
    }];

    let bricks = [];
    const BRICK_ROWS = 6;
    const BRICK_COLS = 6;
    const BRICK_W = 56;
    const BRICK_H = 18;
    const BRICK_GAP = 6;
    const BRICK_OFF_X = 17;
    const BRICK_OFF_Y = 70;
    const BRICK_COLORS = ['#ec4899', '#f43f5e', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    function createBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: BRICK_OFF_X + c * (BRICK_W + BRICK_GAP),
            y: BRICK_OFF_Y + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            color: BRICK_COLORS[r % BRICK_COLORS.length],
            hp: 1
          });
        }
      }
    }

    let particles = [];
    function createParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          color,
          radius: Math.random() * 2 + 1,
          life: 1
        });
      }
    }

    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let isWon = false;

    function resetGame() {
      score = 0;
      lives = 3;
      isGameOver = false;
      isWon = false;
      scoreText.textContent = score;
      livesText.textContent = lives;
      paddle.x = W / 2 - paddle.w / 2;
      balls = [{
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 10,
        vx: 4,
        vy: -5,
        radius: 6,
        stuck: true
      }];
      createBricks();
    }

    // Touch / Pointer
    function updatePaddleFromPointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const x = (clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
      balls.forEach(b => {
        if (b.stuck) b.x = paddle.x + paddle.w / 2;
      });
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      updatePaddleFromPointer(e.clientX);
      balls.forEach(b => {
        if (b.stuck) {
          b.stuck = false;
          playBeep(440, 'triangle', 0.1);
        }
      });
      if (isGameOver || isWon) resetGame();
    });

    window.addEventListener('pointermove', (e) => {
      updatePaddleFromPointer(e.clientX);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        paddle.x = Math.max(0, paddle.x - 20);
        balls.forEach(b => { if (b.stuck) b.x = paddle.x + paddle.w/2; });
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        paddle.x = Math.min(W - paddle.w, paddle.x + 20);
        balls.forEach(b => { if (b.stuck) b.x = paddle.x + paddle.w/2; });
      }
      if (e.code === 'Space') {
        balls.forEach(b => { if (b.stuck) b.stuck = false; });
        if (isGameOver || isWon) resetGame();
      }
    });

    function update() {
      if (isGameOver || isWon) return;

      for (let bi = balls.length - 1; bi >= 0; bi--) {
        const b = balls[bi];
        if (b.stuck) continue;

        b.x += b.vx;
        b.y += b.vy;

        // Walls
        if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -1; playBeep(300); }
        if (b.x + b.radius > W) { b.x = W - b.radius; b.vx *= -1; playBeep(300); }
        if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -1; playBeep(300); }

        // Bottom
        if (b.y + b.radius > H) {
          balls.splice(bi, 1);
          if (balls.length === 0) {
            lives--;
            livesText.textContent = lives;
            playBeep(150, 'sawtooth', 0.3);
            if (lives <= 0) {
              isGameOver = true;
            } else {
              balls.push({
                x: paddle.x + paddle.w / 2,
                y: paddle.y - 10,
                vx: (Math.random() > 0.5 ? 4 : -4),
                vy: -5,
                radius: 6,
                stuck: true
              });
            }
          }
          continue;
        }

        // Paddle hit
        if (
          b.y + b.radius >= paddle.y &&
          b.y - b.radius <= paddle.y + paddle.h &&
          b.x >= paddle.x &&
          b.x <= paddle.x + paddle.w &&
          b.vy > 0
        ) {
          b.vy = -Math.abs(b.vy);
          const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          b.vx = hitPos * 6.5;
          playBeep(520, 'square', 0.06);
        }

        // Brick hit
        for (let i = bricks.length - 1; i >= 0; i--) {
          const br = bricks[i];
          if (
            b.x + b.radius > br.x &&
            b.x - b.radius < br.x + br.w &&
            b.y + b.radius > br.y &&
            b.y - b.radius < br.y + br.h
          ) {
            b.vy *= -1;
            createParticles(br.x + br.w/2, br.y + br.h/2, br.color);
            bricks.splice(i, 1);
            score += 20;
            scoreText.textContent = score;
            playBeep(750, 'sine', 0.08);

            if (bricks.length === 0) {
              isWon = true;
              playBeep(900, 'triangle', 0.4);
            }
            break;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Bricks
      bricks.forEach(br => {
        ctx.fillStyle = br.color;
        ctx.beginPath();
        ctx.roundRect(br.x, br.y, br.w, br.h, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(br.x, br.y, br.w, 3);
      });

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(paddle.x + 10, paddle.y + 2, paddle.w - 20, 3);

      // Balls
      balls.forEach(b => {
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
        ctx.fill();
      });

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap Screen to Restart', W / 2, H / 2 + 25);
      } else if (isWon) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VICTORY!', W / 2, H / 2 - 20);
        ctx.fillStyle = '#facc15';
        ctx.font = '16px sans-serif';
        ctx.fillText('Final Score: ' + score, W / 2, H / 2 + 15);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap to Play Again', W / 2, H / 2 + 50);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    createBricks();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

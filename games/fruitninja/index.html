<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fruit Slicer Ninja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #180802; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  #game-wrapper { position: relative; width: 100%; max-width: 480px; height: 100vh; max-height: 720px; background: radial-gradient(circle at 50% 30%, #3e1b08, #180802); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column; }
  .hud-bar { position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
  .score-box { font-size: 28px; font-weight: 900; color: #f59e0b; text-shadow: 0 3px 6px rgba(0,0,0,0.8); font-family: "Courier New", monospace; }
  .lives-box { display: flex; gap: 6px; font-size: 22px; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #overlay { position: absolute; inset: 0; background: rgba(24, 8, 2, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 20; }
  .ov-title { font-size: 32px; font-weight: 900; color: #ef4444; text-shadow: 0 4px 10px rgba(239,68,68,0.4); margin-bottom: 8px; }
  .ov-desc { font-size: 14px; color: #fed7aa; margin-bottom: 24px; line-height: 1.5; max-width: 300px; }
  .btn-play { padding: 14px 36px; background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; font-size: 18px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 20px rgba(234,88,12,0.4); }
  .btn-play:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game-wrapper">
  <div class="hud-bar">
    <div class="score-box" id="score-display">0</div>
    <div class="lives-box" id="lives-display">❤️❤️❤️</div>
  </div>

  <canvas id="fruitCanvas"></canvas>

  <div id="overlay">
    <h1 class="ov-title" id="ov-title">🍉 FRUIT SLICER</h1>
    <p class="ov-desc" id="ov-desc">স্ক্রিনে আঙুল সোয়াইপ / ড্র্যাগ করে ফলগুলো কাটুন! 💣 বোমা কাটলে বিপদ!</p>
    <button class="btn-play" id="btn-start">শুরু করুন (SLICE)</button>
  </div>
</div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }
  function playSound(type) {
    if (!actx) return;
    try {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      const t = actx.currentTime;
      if (type === 'slash') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
        osc.start(t); osc.stop(t + 0.08);
      } else if (type === 'splat') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t + 0.04);
        gain.gain.setValueAtTime(0.25, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(30, t + 0.4);
        gain.gain.setValueAtTime(0.4, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
        osc.start(t); osc.stop(t + 0.4);
      }
    } catch(e){}
  }

  const canvas = document.getElementById('fruitCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score-display');
  const livesEl = document.getElementById('lives-display');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovDesc = document.getElementById('ov-desc');
  const btnStart = document.getElementById('btn-start');

  let width = 480, height = 720;
  function resize() {
    width = canvas.parentElement.clientWidth || 480;
    height = canvas.parentElement.clientHeight || 720;
    canvas.width = width; canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  let state = 'start'; // start, play, over
  let score = 0;
  let lives = 3;
  let bladeTrail = [];
  let fruits = [];
  let particles = [];
  let spawnTimer = 0;

  const FRUIT_TYPES = [
    { name: 'watermelon', emoji: '🍉', color: '#10b981', radius: 32 },
    { name: 'orange', emoji: '🍊', color: '#f97316', radius: 28 },
    { name: 'banana', emoji: '🍌', color: '#eab308', radius: 26 },
    { name: 'apple', emoji: '🍎', color: '#ef4444', radius: 28 },
    { name: 'strawberry', emoji: '🍓', color: '#ec4899', radius: 24 },
    { name: 'bomb', emoji: '💣', color: '#64748b', radius: 30, isBomb: true }
  ];

  function spawnFruit() {
    const isBomb = Math.random() < 0.22 && score > 5;
    const type = isBomb ? FRUIT_TYPES[5] : FRUIT_TYPES[Math.floor(Math.random() * 5)];
    const startX = 60 + Math.random() * (width - 120);
    const targetX = width / 2 + (Math.random() - 0.5) * (width * 0.5);
    const vx = (targetX - startX) * 0.02;
    const vy = -(13 + Math.random() * 4);

    fruits.push({
      type,
      x: startX,
      y: height + 30,
      vx,
      vy,
      gravity: 0.38,
      rotation: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.1,
      sliced: false,
      slicePieces: []
    });
  }

  function addBladePoint(x, y) {
    bladeTrail.push({ x, y, time: Date.now() });
    if (bladeTrail.length > 10) bladeTrail.shift();
    checkSlices(x, y);
  }

  function checkSlices(x, y) {
    if (state !== 'play') return;
    for (let f of fruits) {
      if (f.sliced) continue;
      const dist = Math.hypot(f.x - x, f.y - y);
      if (dist < f.type.radius + 12) {
        // Sliced!
        f.sliced = true;
        if (f.type.isBomb) {
          playSound('bomb');
          gameOver(true);
          return;
        } else {
          score += 1;
          scoreEl.textContent = score;
          playSound('splat');
          // Spawn juicy particles
          for (let i = 0; i < 14; i++) {
            particles.push({
              x: f.x, y: f.y,
              vx: (Math.random() - 0.5) * 10,
              vy: (Math.random() - 0.5) * 10,
              color: f.type.color,
              radius: Math.random() * 6 + 2,
              life: 1
            });
          }
          // Split pieces
          f.slicePieces = [
            { x: f.x - 10, y: f.y, vx: f.vx - 3, vy: f.vy, rot: f.rotation, vRot: -0.1 },
            { x: f.x + 10, y: f.y, vx: f.vx + 3, vy: f.vy, rot: f.rotation, vRot: 0.1 }
          ];
        }
      }
    }
  }

  // Pointer listeners for drag/slice
  let isPointerDown = false;
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    isPointerDown = true;
    const rect = canvas.getBoundingClientRect();
    addBladePoint(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener('pointermove', (e) => {
    if (!isPointerDown) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    addBladePoint(x, y);
  });

  window.addEventListener('pointerup', () => { isPointerDown = false; });

  btnStart.addEventListener('click', () => { initAudio(); startGame(); });

  function startGame() {
    state = 'play';
    score = 0;
    lives = 3;
    scoreEl.textContent = '0';
    livesEl.textContent = '❤️❤️❤️';
    fruits = [];
    particles = [];
    bladeTrail = [];
    overlay.style.display = 'none';
  }

  function gameOver(byBomb = false) {
    state = 'over';
    ovTitle.textContent = byBomb ? '💣 BOOM! GAME OVER' : '💥 GAME OVER';
    ovDesc.textContent = 'আপনি সর্বমোট ' + score + 'টি ফল কেটেছেন!';
    btnStart.textContent = 'আবার কাটুন (RETRY)';
    overlay.style.display = 'flex';
  }

  function update() {
    if (state !== 'play') return;

    // Prune old blade points
    const now = Date.now();
    bladeTrail = bladeTrail.filter(p => now - p.time < 120);

    // Spawn fruit
    spawnTimer++;
    if (spawnTimer > 45) {
      spawnFruit();
      if (score > 20 && Math.random() < 0.4) spawnFruit();
      spawnTimer = 0;
    }

    // Update fruits
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      if (!f.sliced) {
        f.x += f.vx;
        f.y += f.vy;
        f.vy += f.gravity;
        f.rotation += f.vRot;

        // Missed fruit (fell below screen)
        if (f.y > height + 60 && f.vy > 0) {
          if (!f.type.isBomb) {
            lives--;
            livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver(false);
              return;
            }
          }
          fruits.splice(i, 1);
        }
      } else {
        // Pieces
        let allOffscreen = true;
        for (let p of f.slicePieces) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += f.gravity;
          p.rot += p.vRot;
          if (p.y < height + 80) allOffscreen = false;
        }
        if (allOffscreen) fruits.splice(i, 1);
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw splat particles
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // Draw fruits
    fruits.forEach(f => {
      if (!f.sliced) {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);
        ctx.font = f.type.radius * 1.8 + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.type.emoji, 0, 0);
        ctx.restore();
      } else {
        f.slicePieces.forEach((p, idx) => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.font = f.type.radius * 1.5 + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(f.type.emoji, 0, 0);
          ctx.restore();
        });
      }
    });

    // Draw Glowing Blade Trail
    if (bladeTrail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
      for (let i = 1; i < bladeTrail.length; i++) {
        ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
      }
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>

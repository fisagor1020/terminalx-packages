<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird Deluxe - Touch & Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
    .btn { background: rgba(15, 23, 42, 0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px); transition: 0.2s; }
    .btn:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.3); }
    .score-display { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8); font-family: monospace; letter-spacing: 1px; }
    .bottom-hint { text-align: center; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); padding-bottom: 8px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div class="ui-layer">
      <div class="top-bar">
        <button class="btn" id="soundBtn">🔊 Sound</button>
        <div class="score-display" id="scoreHud">0</div>
        <button class="btn" id="fsBtn">⛶ Fullscreen</button>
      </div>
      <div class="bottom-hint" id="bottomHint">📱 Tap Screen or Press SPACE / UP to Flap</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreHud = document.getElementById('scoreHud');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');

    let W = 400;
    let H = 640;
    canvas.width = W;
    canvas.height = H;

    // Web Audio Synthesizer
    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playTone(freq, type, duration, slide = 0) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq + slide), audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    });

    // Game Variables
    let state = 'START'; // START, PLAYING, GAMEOVER
    let frames = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);

    const bird = {
      x: 80,
      y: 280,
      w: 32,
      h: 24,
      vy: 0,
      gravity: 0.42,
      jump: -7.5,
      rot: 0,
      reset() {
        this.y = 280;
        this.vy = 0;
        this.rot = 0;
      },
      flap() {
        initAudio();
        this.vy = this.jump;
        playTone(400, 'sine', 0.12, 150);
        createParticles(this.x, this.y + 10, '#38bdf8', 6);
      },
      update() {
        this.vy += this.gravity;
        this.y += this.vy;
        this.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.vy * 0.08)));
      },
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        // Bird body
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Wing
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.ellipse(-6, 2, 8, 5, (frames % 12 > 6 ? 0.3 : -0.3), 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(7, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(9, -4, 2.5, 0, Math.PI * 2);
        ctx.fill();
        // Beak
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(12, -2);
        ctx.lineTo(22, 2);
        ctx.lineTo(12, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    };

    const pipes = [];
    const pipeGap = 135;
    const pipeWidth = 56;

    let particles = [];
    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          radius: Math.random() * 3 + 1,
          color,
          life: 1
        });
      }
    }

    function resetGame() {
      bird.reset();
      pipes.length = 0;
      particles = [];
      score = 0;
      frames = 0;
      scoreHud.textContent = '0';
      state = 'PLAYING';
    }

    // Controls
    function handleAction(e) {
      if (e) e.preventDefault();
      initAudio();
      if (state === 'START') {
        resetGame();
        bird.flap();
      } else if (state === 'PLAYING') {
        bird.flap();
      } else if (state === 'GAMEOVER') {
        resetGame();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        handleAction(e);
      }
    });

    canvas.addEventListener('pointerdown', handleAction);

    // Main Game Loop
    function loop() {
      frames++;
      ctx.clearRect(0, 0, W, H);

      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#0284c7');
      bgGrad.addColorStop(0.7, '#38bdf8');
      bgGrad.addColorStop(0.7, '#16a34a');
      bgGrad.addColorStop(1, '#15803d');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Background clouds
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      const cloudOffset = (frames * 0.5) % (W + 100);
      ctx.beginPath();
      ctx.arc(W - cloudOffset + 50, 100, 30, 0, Math.PI*2);
      ctx.arc(W - cloudOffset + 80, 90, 40, 0, Math.PI*2);
      ctx.arc(W - cloudOffset + 110, 100, 25, 0, Math.PI*2);
      ctx.fill();

      // Pipes update & draw
      if (state === 'PLAYING') {
        if (frames % 95 === 0) {
          const minTop = 60;
          const maxTop = H - 180 - pipeGap;
          const topH = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
          pipes.push({
            x: W,
            top: topH,
            bottom: H - 100 - (topH + pipeGap),
            passed: false
          });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.6;

          // Score check
          if (!p.passed && p.x + pipeWidth < bird.x) {
            p.passed = true;
            score++;
            scoreHud.textContent = score;
            playTone(600, 'sine', 0.1, 200);
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('flappy_best', bestScore);
            }
          }

          // Top pipe
          const pGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
          pGrad.addColorStop(0, '#22c55e');
          pGrad.addColorStop(0.7, '#4ade80');
          pGrad.addColorStop(1, '#16a34a');
          ctx.fillStyle = pGrad;
          ctx.fillRect(p.x, 0, pipeWidth, p.top);
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 3;
          ctx.strokeRect(p.x, 0, pipeWidth, p.top);
          // Top pipe cap
          ctx.fillRect(p.x - 4, p.top - 20, pipeWidth + 8, 20);
          ctx.strokeRect(p.x - 4, p.top - 20, pipeWidth + 8, 20);

          // Bottom pipe
          const bottomY = p.top + pipeGap;
          const bottomH = H - 80 - bottomY;
          ctx.fillRect(p.x, bottomY, pipeWidth, bottomH);
          ctx.strokeRect(p.x, bottomY, pipeWidth, bottomH);
          // Bottom pipe cap
          ctx.fillRect(p.x - 4, bottomY, pipeWidth + 8, 20);
          ctx.strokeRect(p.x - 4, bottomY, pipeWidth + 8, 20);

          // Collision detection
          const birdBox = { x: bird.x - 12, y: bird.y - 9, w: 24, h: 18 };
          if (
            birdBox.x + birdBox.w > p.x && birdBox.x < p.x + pipeWidth &&
            (birdBox.y < p.top || birdBox.y + birdBox.h > bottomY)
          ) {
            gameOver();
          }

          if (p.x + pipeWidth < -20) {
            pipes.splice(i, 1);
          }
        }

        bird.update();
        if (bird.y + 12 >= H - 80 || bird.y - 12 <= 0) {
          gameOver();
        }
      }

      // Ground
      ctx.fillStyle = '#eab308';
      ctx.fillRect(0, H - 80, W, 80);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, H - 80, W, 14);
      // Ground stripes
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 3;
      const groundOffset = (frames * 2.6) % 20;
      for (let x = -groundOffset; x < W + 20; x += 20) {
        ctx.beginPath();
        ctx.moveTo(x, H - 66);
        ctx.lineTo(x - 10, H);
        ctx.stroke();
      }

      bird.draw();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Screens
      if (state === 'START') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FLAPPY DELUXE', W / 2, H / 2 - 60);

        ctx.font = '16px "Segoe UI", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Best Score: ' + bestScore, W / 2, H / 2 - 20);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.fillText('⚡ TAP OR SPACE TO START', W / 2, H / 2 + 40);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 32px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 70);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Segoe UI", sans-serif';
        ctx.fillText('Score: ' + score, W / 2, H / 2 - 20);

        ctx.fillStyle = '#facc15';
        ctx.font = '18px "Segoe UI", sans-serif';
        ctx.fillText('👑 Best: ' + bestScore, W / 2, H / 2 + 15);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.fillText('🔄 TAP TO REPLAY', W / 2, H / 2 + 70);
      }

      requestAnimationFrame(loop);
    }

    function gameOver() {
      if (state !== 'GAMEOVER') {
        state = 'GAMEOVER';
        playTone(180, 'sawtooth', 0.35, -90);
        createParticles(bird.x, bird.y, '#ef4444', 20);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower Jumper - Touch & Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c1222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
    .chip { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; backdrop-filter: blur(6px); }
    .btn-hud { background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; }
    .bottom-hint { text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="top-bar">
        <div class="chip" style="color:#38bdf8;">HEIGHT: <span id="scoreText">0</span>m</div>
        <div class="chip" style="color:#facc15;">BEST: <span id="bestText">0</span>m</div>
        <button class="btn-hud" id="soundBtn">🔊 Sound</button>
        <button class="btn-hud" id="fsBtn">⛶ Full</button>
      </div>
      <div class="bottom-hint">Drag or tilt left & right to jump onto platforms</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const bestText = document.getElementById('bestText');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');

    const W = 380;
    const H = 620;
    canvas.width = W;
    canvas.height = H;

    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playJump(freq=400, dur=0.1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    const player = {
      x: W / 2,
      y: H - 100,
      vx: 0,
      vy: -10,
      radius: 16,
      gravity: 0.35,
      jumpSpeed: -10
    };

    let platforms = [];
    let particles = [];
    let cameraY = 0;
    let heightScore = 0;
    let bestScore = parseInt(localStorage.getItem('tower_best') || '0', 10);
    bestText.textContent = bestScore;
    let isGameOver = false;

    function generatePlatforms() {
      platforms = [];
      platforms.push({ x: W/2 - 40, y: H - 40, w: 80, h: 14, type: 'normal' });
      for (let y = H - 120; y > -4000; y -= 65) {
        const type = Math.random() < 0.2 ? 'spring' : (Math.random() < 0.25 ? 'moving' : 'normal');
        platforms.push({
          x: Math.random() * (W - 80),
          y: y,
          w: 75,
          h: 14,
          type: type,
          vx: type === 'moving' ? (Math.random() > 0.5 ? 2 : -2) : 0
        });
      }
    }

    function resetGame() {
      player.x = W / 2;
      player.y = H - 100;
      player.vx = 0;
      player.vy = -10;
      cameraY = 0;
      heightScore = 0;
      isGameOver = false;
      scoreText.textContent = '0';
      generatePlatforms();
    }

    // Pointer / Touch Controls
    let isDragging = false;
    let targetPlayerX = player.x;

    function updateTargetX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      targetPlayerX = (clientX - rect.left) * scaleX;
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      isDragging = true;
      updateTargetX(e.clientX);
      if (isGameOver) resetGame();
    });

    window.addEventListener('pointermove', (e) => {
      if (isDragging) updateTargetX(e.clientX);
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) player.vx = -6;
      if (['ArrowRight', 'KeyD'].includes(e.code)) player.vx = 6;
      if (e.code === 'Space' && isGameOver) resetGame();
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) player.vx = 0;
    });

    function update() {
      if (isGameOver) return;

      // Horizontal movement
      if (isDragging) {
        player.x += (targetPlayerX - player.x) * 0.2;
      } else {
        player.x += player.vx;
      }

      // Screen wrap
      if (player.x < -player.radius) player.x = W + player.radius;
      if (player.x > W + player.radius) player.x = -player.radius;

      // Vertical movement & gravity
      player.vy += player.gravity;
      player.y += player.vy;

      // Platform collisions (only when falling)
      if (player.vy > 0) {
        platforms.forEach(p => {
          if (
            player.x + player.radius > p.x &&
            player.x - player.radius < p.x + p.w &&
            player.y + player.radius >= p.y &&
            player.y - player.radius <= p.y + p.h
          ) {
            if (p.type === 'spring') {
              player.vy = -16;
              playJump(650, 0.18);
            } else {
              player.vy = player.jumpSpeed;
              playJump(420, 0.08);
            }

            for (let i = 0; i < 6; i++) {
              particles.push({
                x: player.x, y: p.y,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 3,
                color: p.type === 'spring' ? '#f59e0b' : '#22c55e',
                life: 1
              });
            }
          }
        });
      }

      // Moving platforms update
      platforms.forEach(p => {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x < 0 || p.x + p.w > W) p.vx *= -1;
        }
      });

      // Camera follow
      if (player.y < H * 0.45) {
        const diff = H * 0.45 - player.y;
        player.y = H * 0.45;
        cameraY += diff;
        heightScore = Math.floor(cameraY / 10);
        scoreText.textContent = heightScore;
        if (heightScore > bestScore) {
          bestScore = heightScore;
          bestText.textContent = bestScore;
          localStorage.setItem('tower_best', bestScore);
        }

        platforms.forEach(p => { p.y += diff; });

        // Add more platforms at top
        const highestPlatform = Math.min(...platforms.map(p => p.y));
        if (highestPlatform > -100) {
          const type = Math.random() < 0.2 ? 'spring' : (Math.random() < 0.25 ? 'moving' : 'normal');
          platforms.push({
            x: Math.random() * (W - 80),
            y: highestPlatform - 65,
            w: 75,
            h: 14,
            type: type,
            vx: type === 'moving' ? 2 : 0
          });
        }
      }

      // Fall to death
      if (player.y > H + 50) {
        isGameOver = true;
        playJump(150, 0.3);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0f172a');
      bg.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Platforms
      platforms.forEach(p => {
        if (p.type === 'spring') {
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 6);
          ctx.fill();
          // Spring icon on platform
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(p.x + p.w/2 - 8, p.y - 6, 16, 6);
        } else if (p.type === 'moving') {
          ctx.fillStyle = '#06b6d4';
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 6);
          ctx.fill();
        } else {
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.w, p.h, 6);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.fillRect(p.x, p.y, p.w, 3);
        }
      });

      // Player Jumper
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x + 4, player.y - 4, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(player.x + 5, player.y - 4, 2, 0, Math.PI*2);
      ctx.fill();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FELL DOWN!', W / 2, H / 2 - 25);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.fillText('Height Reached: ' + heightScore + 'm', W / 2, H / 2 + 15);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('Tap to Jump Again', W / 2, H / 2 + 55);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    generatePlatforms();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Pong Master - Touch & Fullscreen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
    .btn-hud { background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .score-board { font-size: 28px; font-weight: 900; letter-spacing: 4px; font-family: monospace; }
    .p1-score { color: #38bdf8; }
    .p2-score { color: #f43f5e; }
    .hint { text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="top-bar">
        <button class="btn-hud" id="modeBtn">🎮 VS AI</button>
        <div class="score-board"><span class="p2-score" id="aiScore">0</span> : <span class="p1-score" id="playerScore">0</span></div>
        <button class="btn-hud" id="soundBtn">🔊 Sound</button>
        <button class="btn-hud" id="fsBtn">⛶ Full</button>
      </div>
      <div class="hint">Slide finger or mouse on bottom to control your paddle</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('playerScore');
    const aiScoreEl = document.getElementById('aiScore');
    const modeBtn = document.getElementById('modeBtn');
    const soundBtn = document.getElementById('soundBtn');
    const fsBtn = document.getElementById('fsBtn');

    const W = 380;
    const H = 600;
    canvas.width = W;
    canvas.height = H;

    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playBeep(freq, type='sine', dur=0.08) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    let twoPlayerMode = false;
    modeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      twoPlayerMode = !twoPlayerMode;
      modeBtn.textContent = twoPlayerMode ? '👥 2-Player' : '🎮 VS AI';
      resetGame();
    });

    const paddleW = 80;
    const paddleH = 12;

    const player = { x: W / 2 - paddleW / 2, y: H - 40, w: paddleW, h: paddleH, color: '#38bdf8' };
    const opponent = { x: W / 2 - paddleW / 2, y: 30, w: paddleW, h: paddleH, color: '#f43f5e' };

    const ball = {
      x: W / 2,
      y: H / 2,
      vx: 3,
      vy: 4,
      radius: 7,
      speed: 5
    };

    let pScore = 0;
    let oScore = 0;
    let particles = [];
    let isGameOver = false;
    let winner = '';

    function resetBall(servingToPlayer = true) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 5;
      const angle = (Math.random() * 0.8 - 0.4) * Math.PI;
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = (servingToPlayer ? 1 : -1) * Math.cos(angle) * ball.speed;
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          color,
          radius: Math.random() * 2.5 + 1,
          life: 1
        });
      }
    }

    function resetGame() {
      pScore = 0;
      oScore = 0;
      isGameOver = false;
      winner = '';
      playerScoreEl.textContent = '0';
      aiScoreEl.textContent = '0';
      resetBall(true);
    }

    // Touch listeners
    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const x = (clientX - rect.left) * scaleX;
      const y = (clientY - rect.top) * scaleY;

      if (twoPlayerMode && y < H / 2) {
        opponent.x = Math.max(0, Math.min(W - opponent.w, x - opponent.w / 2));
      } else {
        player.x = Math.max(0, Math.min(W - player.w, x - player.w / 2));
      }
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      handlePointer(e.clientX, e.clientY);
      if (isGameOver) resetGame();
    });

    window.addEventListener('pointermove', (e) => {
      handlePointer(e.clientX, e.clientY);
    });

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyD'].includes(e.code)) player.x = Math.max(0, player.x - 25);
      if (['ArrowRight', 'KeyA'].includes(e.code)) player.x = Math.min(W - player.w, player.x + 25);
      if (isGameOver && e.code === 'Space') resetGame();
    });

    function update() {
      if (isGameOver) return;

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Side wall bounce
      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.vx *= -1;
        playBeep(320);
      }
      if (ball.x + ball.radius > W) {
        ball.x = W - ball.radius;
        ball.vx *= -1;
        playBeep(320);
      }

      // Opponent AI (if 1P)
      if (!twoPlayerMode) {
        const targetX = ball.x - opponent.w / 2;
        const aiSpeed = 3.6 + Math.min(2.5, (pScore + oScore) * 0.2);
        opponent.x += (targetX - opponent.x) * 0.12;
        opponent.x = Math.max(0, Math.min(W - opponent.w, opponent.x));
      }

      // Player paddle collision
      if (
        ball.y + ball.radius >= player.y &&
        ball.y - ball.radius <= player.y + player.h &&
        ball.x >= player.x &&
        ball.x <= player.x + player.w &&
        ball.vy > 0
      ) {
        ball.speed = Math.min(10, ball.speed + 0.3);
        const offset = (ball.x - (player.x + player.w / 2)) / (player.w / 2);
        ball.vx = offset * ball.speed * 0.9;
        ball.vy = -Math.sqrt(Math.max(1, ball.speed * ball.speed - ball.vx * ball.vx));
        createParticles(ball.x, player.y, player.color);
        playBeep(520, 'triangle', 0.08);
      }

      // Opponent paddle collision
      if (
        ball.y - ball.radius <= opponent.y + opponent.h &&
        ball.y + ball.radius >= opponent.y &&
        ball.x >= opponent.x &&
        ball.x <= opponent.x + opponent.w &&
        ball.vy < 0
      ) {
        ball.speed = Math.min(10, ball.speed + 0.3);
        const offset = (ball.x - (opponent.x + opponent.w / 2)) / (opponent.w / 2);
        ball.vx = offset * ball.speed * 0.9;
        ball.vy = Math.sqrt(Math.max(1, ball.speed * ball.speed - ball.vx * ball.vx));
        createParticles(ball.x, opponent.y + opponent.h, opponent.color);
        playBeep(420, 'triangle', 0.08);
      }

      // Goal Bottom (Opponent scores)
      if (ball.y > H + 10) {
        oScore++;
        aiScoreEl.textContent = oScore;
        createParticles(W / 2, H - 20, '#f43f5e');
        playBeep(180, 'sawtooth', 0.3);
        if (oScore >= 7) {
          isGameOver = true;
          winner = twoPlayerMode ? 'RED PLAYER WINS!' : 'AI WINS!';
        } else {
          resetBall(false);
        }
      }

      // Goal Top (Player scores)
      if (ball.y < -10) {
        pScore++;
        playerScoreEl.textContent = pScore;
        createParticles(W / 2, 20, '#38bdf8');
        playBeep(700, 'sine', 0.2);
        if (pScore >= 7) {
          isGameOver = true;
          winner = twoPlayerMode ? 'BLUE PLAYER WINS!' : 'YOU WIN!';
        } else {
          resetBall(true);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Arena background
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, W, H);

      // Center line
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Center ring
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 40, 0, Math.PI*2);
      ctx.stroke();

      // Draw Paddles
      ctx.fillStyle = opponent.color;
      ctx.beginPath();
      ctx.roundRect(opponent.x, opponent.y, opponent.w, opponent.h, 6);
      ctx.fill();
      ctx.shadowColor = opponent.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.w, player.h, 6);
      ctx.fill();
      ctx.shadowColor = player.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, W / 2, H / 2 - 20);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '14px sans-serif';
        ctx.fillText('Tap Screen to Play Again (First to 7)', W / 2, H / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>

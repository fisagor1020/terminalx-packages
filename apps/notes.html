<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Notes</title>
<style>
  :root{
    --bg: #000000;
    --panel: #131313;
    --panel2: #1c1c1c;
    --border: #2a2a2a;
    --accent: #ffc107;
    --accent-dim: rgba(255,193,7,.15);
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --danger: #ff5c5c;
    --pill-bg: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, select, input, textarea { font-family: inherit; }
  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 3px; }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .hidden { display: none !important; }

  /* ---------- LIST SCREEN ---------- */
  #listHeader {
    padding: 16px 16px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #folderIcon {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex: 0 0 auto;
  }
  #listTitleWrap { flex: 1; min-width: 0; }
  #catSelect {
    -webkit-appearance: none; appearance: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 21px;
    font-weight: 700;
    padding: 0;
    margin: 0;
  }
  #catSelect option { background: var(--panel2); color: var(--text); }
  #listSubtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #listHeaderActions { display: flex; gap: 6px; flex: 0 0 auto; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--panel2); }

  #searchBar {
    display: none;
    padding: 0 16px 10px;
  }
  #searchBar.show { display: block; }
  #searchInputWrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 12px;
  }
  #searchInput {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchClose { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 90px;
  }
  .note-card {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .note-card .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 22px;
  }
  .note-card .card-preview {
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
  }
  .note-card .card-date {
    display: inline-block;
    margin-top: 10px;
    background: var(--pill-bg);
    color: var(--muted);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
  }
  .note-card .card-tag-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:6px; vertical-align:2px;
  }
  .card-tag-general .card-tag-dot{ background: var(--accent); }
  .card-tag-task .card-tag-dot{ background: #4ad0ff; }
  .card-tag-idea .card-tag-dot{ background: #9c7bff; }
  .card-tag-urgent .card-tag-dot{ background: var(--danger); }
  .note-card .pin-mark {
    position: absolute;
    top: 16px; right: 0;
    color: var(--accent);
    font-size: 13px;
  }

  #emptyState {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    padding: 0 30px;
    line-height: 1.7;
  }

  #fab {
    position: fixed;
    right: 20px;
    bottom: 78px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    border: none;
    font-size: 26px;
    font-weight: 300;
    box-shadow: 0 4px 18px rgba(255,193,7,.45);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  #fab:active { transform: scale(.94); }

  #bottomNav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 4;
  }
  .nav-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    cursor: pointer;
  }
  .nav-tab .nav-icon { font-size: 19px; }
  .nav-tab.active { color: var(--accent); }

  /* ---------- DETAIL SCREEN ---------- */
  #detailHeader {
    padding: 14px 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #detailHeader .icon-btn { font-size: 20px; }
  #detailSpacer { flex: 1; }

  #detailBody {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 30px;
    display: flex;
    flex-direction: column;
  }
  #titleInput {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 25px;
    font-weight: 700;
    outline: none;
    padding: 6px 0;
  }
  #titleInput::placeholder { color: var(--muted); font-weight: 700; }

  #metaRow {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  #metaRow .dot { opacity: .6; }
  #catSelectDetail {
    -webkit-appearance: none; appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    padding: 0;
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  #catSelectDetail option { background: var(--panel2); color: var(--text); }

  #contentInput {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.6;
    outline: none;
    resize: none;
    min-height: 200px;
  }
  #contentInput::placeholder { color: var(--muted); }

  #quickToolbar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #quickToolbar button {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  #quickToolbar .pin-toggle.active { color: var(--accent); border-color: var(--accent); }

  /* ---------- action sheet ---------- */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: flex-end;
    z-index: 40;
  }
  .sheet-overlay.show { display: flex; }
  .sheet {
    background: var(--panel2);
    width: 100%;
    border-radius: 16px 16px 0 0;
    padding: 8px 0 20px;
  }
  .sheet button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 14px 22px;
    font-size: 15px;
    cursor: pointer;
  }
  .sheet button:active { background: var(--panel); }
  .sheet button.danger { color: var(--danger); }
  .sheet .sheet-cancel { color: var(--muted); border-top: 1px solid var(--border); margin-top: 6px; }

  #toast {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #toast button { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<!-- ================= LIST SCREEN ================= -->
<div class="screen" id="screenList">
  <div id="listHeader">
    <div id="folderIcon">🗒️</div>
    <div id="listTitleWrap">
      <select id="catSelect">
        <option value="all">All ▾</option>
        <option value="general">General ▾</option>
        <option value="task">Task ▾</option>
        <option value="idea">Idea ▾</option>
        <option value="urgent">Urgent ▾</option>
      </select>
      <div id="listSubtitle">0 notes</div>
    </div>
    <div id="listHeaderActions">
      <button class="icon-btn" id="searchToggleBtn" title="Search">🔍</button>
      <button class="icon-btn" id="sortBtn" title="Sort">☰</button>
    </div>
  </div>

  <div id="searchBar">
    <div id="searchInputWrap">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="Search notes...">
      <button id="searchClose">✕</button>
    </div>
  </div>

  <div id="list"></div>

  <button id="fab">+</button>

  <div id="bottomNav">
    <button class="nav-tab active" data-tab="notes"><span class="nav-icon">🗒️</span>Notes</button>
    <button class="nav-tab" data-tab="todo"><span class="nav-icon">✅</span>To-do</button>
    <button class="nav-tab" data-tab="me"><span class="nav-icon">🙍</span>Me</button>
  </div>
</div>

<!-- ================= DETAIL SCREEN ================= -->
<div class="screen hidden" id="screenDetail">
  <div id="detailHeader">
    <button class="icon-btn" id="backBtn">←</button>
    <div id="detailSpacer"></div>
    <button class="icon-btn" id="checklistBtn" title="Insert checklist item">☑</button>
    <button class="icon-btn" id="menuBtn" title="More">⋮</button>
  </div>

  <div id="detailBody">
    <input id="titleInput" type="text" placeholder="Title">
    <div id="metaRow">
      <span id="metaDate"></span>
      <span class="dot">·</span>
      <span id="metaChars">0 characters</span>
      <span class="dot">·</span>
      <select id="catSelectDetail">
        <option value="general">Uncategorized</option>
        <option value="general">General</option>
        <option value="task">Task</option>
        <option value="idea">Idea</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>
    <textarea id="contentInput" placeholder="Start writing..."></textarea>
  </div>

  <div id="quickToolbar">
    <button class="pin-toggle" id="pinToggleBtn">📌 Pin</button>
    <button id="copyBtn">📋 Copy</button>
    <button id="deleteFromToolbarBtn">🗑 Delete</button>
  </div>
</div>

<!-- ================= ACTION SHEET (⋮ menu) ================= -->
<div class="sheet-overlay" id="menuSheet">
  <div class="sheet">
    <button id="sheetPin">📌 Pin / Unpin</button>
    <button id="sheetDuplicate">📑 Duplicate</button>
    <button id="sheetCopy">📋 Copy text</button>
    <button id="sheetExport">⬇ Export this note</button>
    <button class="danger" id="sheetDelete">🗑 Delete</button>
    <button class="sheet-cancel" id="sheetCancel">Cancel</button>
  </div>
</div>

<div id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn" style="display:none;">Undo</button>
</div>

<script>
  // Sandboxed srcdoc iframe, opaque origin each open -> no reliable
  // localStorage. Notes live in memory for this session; use Export
  // (⋮ menu on a note) + copy/paste to carry notes between sessions.

  let notes = [];       // { id, title, text, tag, pinned, createdAt, updatedAt }
  let nextId = 1;
  let activeCategory = "all";
  let searchTerm = "";
  let sortMode = "newest";  // newest | oldest | az
  let currentNoteId = null; // note being edited in detail screen, or null = new
  let lastDeleted = null;
  let toastTimer = null;

  const TAG_LABEL = { general: "General", task: "Task", idea: "Idea", urgent: "Urgent" };

  const screenList = document.getElementById("screenList");
  const screenDetail = document.getElementById("screenDetail");

  const catSelect = document.getElementById("catSelect");
  const listSubtitle = document.getElementById("listSubtitle");
  const listEl = document.getElementById("list");
  const fab = document.getElementById("fab");
  const searchToggleBtn = document.getElementById("searchToggleBtn");
  const sortBtn = document.getElementById("sortBtn");
  const searchBar = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  const searchClose = document.getElementById("searchClose");
  const navTabs = document.querySelectorAll(".nav-tab");

  const backBtn = document.getElementById("backBtn");
  const checklistBtn = document.getElementById("checklistBtn");
  const menuBtn = document.getElementById("menuBtn");
  const titleInput = document.getElementById("titleInput");
  const contentInput = document.getElementById("contentInput");
  const metaDate = document.getElementById("metaDate");
  const metaChars = document.getElementById("metaChars");
  const catSelectDetail = document.getElementById("catSelectDetail");
  const pinToggleBtn = document.getElementById("pinToggleBtn");
  const copyBtn = document.getElementById("copyBtn");
  const deleteFromToolbarBtn = document.getElementById("deleteFromToolbarBtn");

  const menuSheet = document.getElementById("menuSheet");
  const sheetPin = document.getElementById("sheetPin");
  const sheetDuplicate = document.getElementById("sheetDuplicate");
  const sheetCopy = document.getElementById("sheetCopy");
  const sheetExport = document.getElementById("sheetExport");
  const sheetDelete = document.getElementById("sheetDelete");
  const sheetCancel = document.getElementById("sheetCancel");

  const toastEl = document.getElementById("toast");
  const toastMsg = document.getElementById("toastMsg");
  const undoBtn = document.getElementById("undoBtn");

  /* ---------- helpers ---------- */

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  function showToast(message, withUndo) {
    clearTimeout(toastTimer);
    toastMsg.textContent = message;
    undoBtn.style.display = withUndo ? "inline" : "none";
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => {
      toastEl.classList.remove("show");
      lastDeleted = null;
    }, 4000);
  }
  function formatDateBadge(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: "long", day: "numeric" });
  }
  function formatDateTime(ts) {
    const d = new Date(ts);
    const date = (d.getMonth() + 1) + "/" + d.getDate() + "/" + d.getFullYear();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${date}, ${hh}:${mm}`;
  }

  /* ---------- list rendering ---------- */

  function visibleNotes() {
    let list = [...notes];
    if (activeCategory !== "all") list = list.filter(n => n.tag === activeCategory);
    if (searchTerm) {
      const t = searchTerm.toLowerCase();
      list = list.filter(n => (n.title + " " + n.text).toLowerCase().includes(t));
    }
    list.sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (sortMode === "oldest") return a.createdAt - b.createdAt;
      if (sortMode === "az") return (a.title || a.text).localeCompare(b.title || b.text);
      return b.updatedAt - a.updatedAt;
    });
    return list;
  }

  function renderList() {
    const items = visibleNotes();
    listSubtitle.textContent = `${notes.length} note${notes.length === 1 ? "" : "s"}`;
    listEl.innerHTML = "";

    if (notes.length === 0) {
      listEl.innerHTML = `<div id="emptyState">কোনো নোট নেই।<br>ডানে নিচের ⊕ বাটনে চাপ দিয়ে প্রথম নোট লিখুন।</div>`;
      return;
    }
    if (items.length === 0) {
      listEl.innerHTML = `<div id="emptyState">কোনো ফলাফল পাওয়া যায়নি।</div>`;
      return;
    }

    items.forEach(note => {
      const card = document.createElement("div");
      card.className = `note-card card-tag-${note.tag}`;
      const title = note.title && note.title.trim() ? note.title : "Untitled note";
      const preview = note.text ? note.text.replace(/\n/g, " ") : "";
      card.innerHTML = `
        ${note.pinned ? '<span class="pin-mark">📌</span>' : ""}
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-preview">${escapeHtml(preview) || "&nbsp;"}</div>
        <span class="card-date"><span class="card-tag-dot"></span>${formatDateBadge(note.updatedAt)}</span>
      `;
      card.onclick = () => openDetail(note.id);
      listEl.appendChild(card);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  /* ---------- detail screen ---------- */

  function openDetail(id) {
    currentNoteId = id;
    const note = notes.find(n => n.id === id);
    titleInput.value = note ? note.title : "";
    contentInput.value = note ? note.text : "";
    catSelectDetail.value = note ? note.tag : "general";
    pinToggleBtn.classList.toggle("active", !!(note && note.pinned));
    metaDate.textContent = note ? formatDateTime(note.updatedAt) : formatDateTime(Date.now());
    updateCharCount();
    showScreen(screenDetail);
    setTimeout(() => titleInput.focus(), 50);
  }

  function openNewNote() {
    currentNoteId = null;
    titleInput.value = "";
    contentInput.value = "";
    catSelectDetail.value = "general";
    pinToggleBtn.classList.remove("active");
    metaDate.textContent = formatDateTime(Date.now());
    updateCharCount();
    showScreen(screenDetail);
    setTimeout(() => titleInput.focus(), 50);
  }

  function updateCharCount() {
    const total = titleInput.value.length + contentInput.value.length;
    metaChars.textContent = `${total} character${total === 1 ? "" : "s"}`;
  }

  function saveCurrentNote() {
    const title = titleInput.value.trim();
    const text = contentInput.value.trim();
    if (!title && !text) return; // nothing to save

    if (currentNoteId === null) {
      const now = Date.now();
      notes.unshift({
        id: nextId++, title, text, tag: catSelectDetail.value,
        pinned: false, createdAt: now, updatedAt: now
      });
    } else {
      const note = notes.find(n => n.id === currentNoteId);
      if (note) {
        note.title = title;
        note.text = text;
        note.tag = catSelectDetail.value;
        note.updatedAt = Date.now();
      }
    }
  }

  function closeDetail() {
    const title = titleInput.value.trim();
    const text = contentInput.value.trim();
    if (currentNoteId === null && !title && !text) {
      // discard empty new note
      showScreen(screenList);
      renderList();
      return;
    }
    saveCurrentNote();
    showScreen(screenList);
    renderList();
  }

  function showScreen(screen) {
    screenList.classList.add("hidden");
    screenDetail.classList.add("hidden");
    screen.classList.remove("hidden");
  }

  /* ---------- detail actions ---------- */

  backBtn.addEventListener("click", closeDetail);

  checklistBtn.addEventListener("click", () => {
    const pos = contentInput.selectionStart || contentInput.value.length;
    const before = contentInput.value.slice(0, pos);
    const after = contentInput.value.slice(pos);
    const needsNewline = before.length && !before.endsWith("\n");
    const insert = (needsNewline ? "\n" : "") + "- [ ] ";
    contentInput.value = before + insert + after;
    const newPos = pos + insert.length;
    contentInput.focus();
    contentInput.setSelectionRange(newPos, newPos);
    updateCharCount();
  });

  titleInput.addEventListener("input", updateCharCount);
  contentInput.addEventListener("input", updateCharCount);

  pinToggleBtn.addEventListener("click", () => {
    if (currentNoteId === null) { saveCurrentNote(); currentNoteId = notes[0].id; }
    const note = notes.find(n => n.id === currentNoteId);
    if (!note) return;
    note.pinned = !note.pinned;
    pinToggleBtn.classList.toggle("active", note.pinned);
    showToast(note.pinned ? "Pinned." : "Unpinned.", false);
  });

  copyBtn.addEventListener("click", () => {
    const full = (titleInput.value ? titleInput.value + "\n" : "") + contentInput.value;
    copyToClipboard(full);
    showToast("Note copied.", false);
  });

  deleteFromToolbarBtn.addEventListener("click", () => {
    if (currentNoteId === null) {
      showScreen(screenList);
      return;
    }
    deleteNote(currentNoteId, true);
  });

  /* ---------- action sheet ---------- */

  menuBtn.addEventListener("click", () => menuSheet.classList.add("show"));
  sheetCancel.addEventListener("click", () => menuSheet.classList.remove("show"));
  menuSheet.addEventListener("click", e => { if (e.target === menuSheet) menuSheet.classList.remove("show"); });

  sheetPin.addEventListener("click", () => { menuSheet.classList.remove("show"); pinToggleBtn.click(); });

  sheetDuplicate.addEventListener("click", () => {
    menuSheet.classList.remove("show");
    saveCurrentNote();
    const src = notes.find(n => n.id === currentNoteId) || {
      title: titleInput.value, text: contentInput.value, tag: catSelectDetail.value
    };
    const now = Date.now();
    const copy = {
      id: nextId++, title: (src.title || "Untitled") + " (copy)", text: src.text,
      tag: src.tag, pinned: false, createdAt: now, updatedAt: now
    };
    notes.unshift(copy);
    showToast("Note duplicated.", false);
    openDetail(copy.id);
  });

  sheetCopy.addEventListener("click", () => { menuSheet.classList.remove("show"); copyBtn.click(); });

  sheetExport.addEventListener("click", () => {
    menuSheet.classList.remove("show");
    const payload = JSON.stringify({
      app: "TerminalX-Notes", version: 1, exportedAt: new Date().toISOString(),
      note: { title: titleInput.value, text: contentInput.value, tag: catSelectDetail.value }
    }, null, 2);
    copyToClipboard(payload);
    showToast("Note JSON copied to clipboard.", false);
  });

  sheetDelete.addEventListener("click", () => {
    menuSheet.classList.remove("show");
    if (currentNoteId === null) { showScreen(screenList); return; }
    deleteNote(currentNoteId, true);
  });

  /* ---------- delete / undo ---------- */

  function deleteNote(id, goBackToList) {
    const index = notes.findIndex(n => n.id === id);
    if (index === -1) return;
    lastDeleted = { note: notes[index], index };
    notes.splice(index, 1);
    if (goBackToList) { currentNoteId = null; showScreen(screenList); }
    renderList();
    showToast("Note deleted.", true);
  }

  undoBtn.addEventListener("click", () => {
    if (!lastDeleted) return;
    notes.splice(Math.min(lastDeleted.index, notes.length), 0, lastDeleted.note);
    lastDeleted = null;
    toastEl.classList.remove("show");
    renderList();
  });

  /* ---------- list screen controls ---------- */

  fab.addEventListener("click", openNewNote);

  catSelect.addEventListener("change", () => { activeCategory = catSelect.value; renderList(); });

  searchToggleBtn.addEventListener("click", () => {
    searchBar.classList.add("show");
    searchInput.focus();
  });
  searchClose.addEventListener("click", () => {
    searchInput.value = "";
    searchTerm = "";
    searchBar.classList.remove("show");
    renderList();
  });
  searchInput.addEventListener("input", () => { searchTerm = searchInput.value.trim(); renderList(); });

  const SORT_LABELS = { newest: "Newest first", oldest: "Oldest first", az: "A–Z" };
  sortBtn.addEventListener("click", () => {
    const order = ["newest", "oldest", "az"];
    sortMode = order[(order.indexOf(sortMode) + 1) % order.length];
    renderList();
    showToast("Sorted: " + SORT_LABELS[sortMode], false);
  });

  navTabs.forEach(tab => {
    tab.addEventListener("click", () => {
      if (tab.dataset.tab !== "notes") {
        showToast("এই ট্যাব এখনো এই অ্যাপে নেই — শুধু Notes কাজ করে।", false);
        return;
      }
      navTabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
    });
  });

  renderList();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Notes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-weight: bold;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .note {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .note button {
    background: transparent;
    color: #f85149;
    border: none;
    font-size: 16px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #161b22;
    border-top: 1px solid #30363d;
  }
  #noteInput {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #e6edf3;
  }
  #addBtn {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    background: #238636;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  #empty {
    color: #7d8590;
    text-align: center;
    margin-top: 30px;
  }
</style>
</head>
<body>

<header>📝 Notes (gitapp demo)</header>

<div id="list"></div>

<div id="inputBar">
  <input id="noteInput" type="text" placeholder="Write a note and press Add..." />
  <button id="addBtn">Add</button>
</div>

<script>
  // Note: this runs inside a sandboxed srcdoc iframe with no
  // allow-same-origin, so it gets a fresh opaque origin every time
  // it's opened -- localStorage isn't reliable here. Notes are kept
  // in memory only, for the lifetime of this open session.
  let notes = [];

  const listEl = document.getElementById("list");
  const inputEl = document.getElementById("noteInput");
  const addBtn = document.getElementById("addBtn");

  function render() {
    listEl.innerHTML = "";
    if (notes.length === 0) {
      listEl.innerHTML = "<div id='empty'>কোনো নোট নেই। নিচে লিখে Add চাপুন।</div>";
      return;
    }
    notes.forEach((text, i) => {
      const div = document.createElement("div");
      div.className = "note";
      const span = document.createElement("span");
      span.textContent = text;
      const btn = document.createElement("button");
      btn.textContent = "✕";
      btn.onclick = () => {
        notes.splice(i, 1);
        render();
      };
      div.appendChild(span);
      div.appendChild(btn);
      listEl.appendChild(div);
    });
  }

  function addNote() {
    const val = inputEl.value.trim();
    if (!val) return;
    notes.unshift(val);
    inputEl.value = "";
    render();
  }

  addBtn.addEventListener("click", addNote);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") addNote();
  });

  render();
</script>

</body>
</html>
